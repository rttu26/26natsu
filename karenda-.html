<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>ぷっくりカレンダー</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
}

body{
  color:#66515f;
  background:
    radial-gradient(circle at 8% 12%,#ffd2e5 0 42px,transparent 43px),
    radial-gradient(circle at 92% 10%,#d8c9ff 0 52px,transparent 53px),
    radial-gradient(circle at 8% 90%,#ffe7a9 0 35px,transparent 36px),
    radial-gradient(circle at 94% 82%,#ffc9df 0 48px,transparent 49px),
    linear-gradient(135deg,#fff1f8,#f1eaff);
}

/* ---------- スマホ本体 ---------- */

.phone{
  position:relative;
  z-index:2;
  width:min(430px,100%);
  min-height:100vh;
  margin:auto;
  overflow:hidden;
  background:
    linear-gradient(160deg,#fffafd,#fff5fa 55%,#f7efff);
  box-shadow:0 25px 70px rgba(110,70,100,.2);
}

@media(min-width:600px){
  body{
    padding:25px 0;
  }

  .phone{
    min-height:calc(100vh - 50px);
    border-radius:42px;
    box-shadow:
      0 0 0 8px #29252b,
      0 0 0 10px #55505a,
      0 30px 80px rgba(80,45,75,.3);
  }
}

/* ---------- 背景ぷっくり装飾 ---------- */

.blob{
  position:fixed;
  pointer-events:none;
  z-index:0;
  border-radius:50%;
  filter:blur(.2px);
  box-shadow:
    inset 8px 8px 15px rgba(255,255,255,.75),
    inset -8px -8px 15px rgba(160,80,130,.12),
    0 15px 30px rgba(170,90,140,.1);
}

.blob.a{
  width:70px;
  height:70px;
  left:2%;
  top:180px;
  background:linear-gradient(145deg,#ffc5dd,#ff8fbd);
}

.blob.b{
  width:55px;
  height:55px;
  right:3%;
  top:390px;
  background:linear-gradient(145deg,#d8c7ff,#a88de9);
}

.blob.c{
  width:42px;
  height:42px;
  left:4%;
  bottom:110px;
  background:linear-gradient(145deg,#fff3a9,#ffd66e);
}

.star{
  position:fixed;
  z-index:0;
  pointer-events:none;
  width:42px;
  height:42px;
  clip-path:polygon(
    50% 0%,61% 37%,100% 50%,61% 63%,
    50% 100%,39% 63%,0% 50%,39% 37%
  );
  background:linear-gradient(145deg,#fff7a5,#ffd76d);
  filter:drop-shadow(0 8px 8px rgba(220,170,50,.18));
}

.star.a{
  top:75px;
  right:10%;
}

.star.b{
  left:2%;
  top:330px;
  transform:scale(.55);
}

.star.c{
  right:7%;
  bottom:145px;
  transform:scale(.7);
}

/* ---------- ヘッダー ---------- */

.header{
  position:relative;
  padding:38px 23px 27px;
  color:#fff;
  background:
    linear-gradient(145deg,#ffb5d2,#ff8fbd 55%,#c4a6f1);
  border-radius:0 0 36px 36px;
  box-shadow:0 10px 30px rgba(221,105,153,.25);
}

.logo{
  font-size:11px;
  font-weight:900;
  letter-spacing:2px;
  opacity:.92;
}

.title{
  margin-top:6px;
  font-size:28px;
  font-weight:900;
  letter-spacing:.5px;
  text-shadow:0 3px 0 rgba(180,70,120,.18);
}

.subtitle{
  margin-top:4px;
  font-size:12px;
  opacity:.92;
}

.bubble{
  position:absolute;
  right:22px;
  top:25px;
  width:62px;
  height:48px;
  border-radius:18px;
  background:linear-gradient(145deg,#d0f7ff,#79d9f1);
  box-shadow:
    inset 5px 5px 9px rgba(255,255,255,.7),
    inset -5px -5px 8px rgba(50,130,160,.12),
    0 9px 15px rgba(70,130,160,.16);
}

/* ---------- コンテンツ ---------- */

.content{
  position:relative;
  z-index:2;
  padding:19px 15px 35px;
}

.monthbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.monthtitle{
  font-size:21px;
  font-weight:900;
}

.circle-btn{
  width:41px;
  height:41px;
  border:0;
  border-radius:50%;
  color:#fff;
  font-size:20px;
  background:linear-gradient(145deg,#ffb6d4,#ee76aa);
  box-shadow:
    inset 3px 3px 6px rgba(255,255,255,.6),
    inset -3px -3px 5px rgba(170,50,100,.1),
    0 7px 13px rgba(220,100,150,.18);
}

/* ---------- カレンダー ---------- */

.calendar-card{
  padding:10px;
  border-radius:25px;
  background:rgba(255,255,255,.72);
  box-shadow:
    inset 2px 2px 8px rgba(255,255,255,.95),
    0 12px 30px rgba(160,100,145,.12);
}

.weekdays,
.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
}

.weekday{
  text-align:center;
  padding:7px 0;
  font-size:9px;
  font-weight:900;
  color:#a47d91;
}

.weekday:first-child{
  color:#eb759d;
}

.weekday:last-child{
  color:#8c87c8;
}

.calendar{
  gap:5px;
}

.day{
  min-height:82px;
  padding:6px 5px;
  border-radius:13px;
  background:linear-gradient(145deg,#fff,#fff5fa);
  box-shadow:
    inset 2px 2px 5px rgba(255,255,255,.95),
    0 3px 7px rgba(170,100,145,.08);
  overflow:hidden;
}

.day.disabled{
  opacity:.28;
}

.day-number{
  font-size:12px;
  font-weight:900;
}

.sunday .day-number{
  color:#ed7199;
}

.saturday .day-number{
  color:#8883c4;
}

.start-day{
  background:linear-gradient(145deg,#fff6aa,#ffdba2);
}

.start-label{
  display:block;
  margin-top:2px;
  font-size:7px;
  font-weight:900;
  color:#d48b42;
}

.event{
  margin-top:5px;
  padding:4px 5px;
  border-radius:8px;
  color:#995372;
  background:linear-gradient(145deg,#ffd8e8,#ffb4d2);
  box-shadow:
    inset 2px 2px 4px rgba(255,255,255,.72),
    0 3px 5px rgba(210,100,145,.12);
  font-size:8px;
  font-weight:800;
  line-height:1.35;
  word-break:break-word;
}

.event.done{
  color:#4c896f;
  background:linear-gradient(145deg,#dcf8e9,#afe5ca);
  text-decoration:line-through;
  opacity:.82;
}

.event-time{
  display:block;
  margin-top:2px;
  font-size:7px;
  opacity:.75;
}

/* ---------- 製作者ボタン ---------- */

.creator-button{
  width:100%;
  margin-top:18px;
  padding:15px;
  border:0;
  border-radius:18px;
  color:#fff;
  font-size:14px;
  font-weight:900;
  background:linear-gradient(145deg,#bda6ef,#9375d9);
  box-shadow:
    inset 3px 3px 6px rgba(255,255,255,.48),
    inset -4px -4px 6px rgba(80,50,150,.1),
    0 9px 17px rgba(130,100,190,.2);
}

/* ---------- 製作者ページ ---------- */

.creator-page{
  display:none;
}

.card{
  padding:20px;
  border-radius:25px;
  background:rgba(255,255,255,.8);
  box-shadow:
    inset 2px 2px 8px rgba(255,255,255,.95),
    0 12px 30px rgba(160,100,145,.12);
}

.card h2{
  margin:0 0 17px;
  font-size:20px;
}

.notice{
  padding:12px 13px;
  margin-bottom:16px;
  border-radius:14px;
  background:#fff3b8;
  color:#967537;
  font-size:11px;
  font-weight:700;
  line-height:1.55;
}

label{
  display:block;
  margin:15px 0 6px;
  font-size:12px;
  font-weight:900;
}

input,
textarea{
  width:100%;
  border:0;
  outline:0;
  padding:13px;
  border-radius:15px;
  background:#fff;
  color:#65505e;
  font-family:inherit;
  font-size:15px;
  box-shadow:
    inset 2px 2px 6px rgba(170,100,140,.1);
}

textarea{
  min-height:110px;
  resize:vertical;
}

.status-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.status-button{
  border:0;
  padding:13px 7px;
  border-radius:15px;
  background:#f3eaf0;
  color:#806777;
  font-size:12px;
  font-weight:900;
}

.status-button.selected.todo{
  color:#9b5275;
  background:linear-gradient(145deg,#ffd8e8,#ffb5d2);
  box-shadow:inset 2px 2px 5px rgba(255,255,255,.7);
}

.status-button.selected.done{
  color:#4c8a70;
  background:linear-gradient(145deg,#d9f7e7,#aee5ca);
  box-shadow:inset 2px 2px 5px rgba(255,255,255,.7);
}

.help{
  margin-top:6px;
  color:#a58d99;
  font-size:9px;
}

.time-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.time-label{
  margin-bottom:5px;
  color:#987889;
  font-size:10px;
  font-weight:800;
}

.action-row{
  display:flex;
  gap:9px;
  margin-top:18px;
}

.save-button,
.delete-button,
.back-button{
  border:0;
  border-radius:15px;
  padding:13px;
  font-weight:900;
}

.save-button{
  flex:1;
  color:#fff;
  background:linear-gradient(145deg,#ffafd0,#ed71a7);
}

.delete-button{
  flex:.5;
  color:#9b6c7e;
  background:#ffe8f1;
}

.back-button{
  width:100%;
  margin-bottom:14px;
  color:#fff;
  background:linear-gradient(145deg,#bba1ed,#9274d7);
}

/* ---------- パスワード ---------- */

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:1000;
  align-items:center;
  justify-content:center;
  padding:25px;
  background:rgba(70,45,65,.4);
  backdrop-filter:blur(5px);
}

.modal-box{
  width:min(350px,100%);
  padding:25px;
  border-radius:28px;
  background:linear-gradient(145deg,#fff,#fff3f9);
  box-shadow:0 25px 70px rgba(70,40,65,.25);
}

.modal-box h2{
  margin-top:0;
}

.modal-buttons{
  display:flex;
  gap:10px;
  margin-top:13px;
}

.modal-buttons button{
  flex:1;
  border:0;
  border-radius:14px;
  padding:12px;
  font-weight:900;
}

.password-ok{
  color:#fff;
  background:linear-gradient(145deg,#ffafd0,#eb72a6);
}

.password-cancel{
  color:#755d69;
  background:#f0e8ed;
}

.footer{
  margin-top:18px;
  text-align:center;
  color:#b18d9f;
  font-size:10px;
}

.loading{
  text-align:center;
  padding:30px 10px;
  color:#b18d9f;
  font-size:12px;
}

@media(max-width:360px){
  .day{
    min-height:68px;
  }

  .event{
    font-size:7px;
  }

  .title{
    font-size:24px;
  }
}
</style>
</head>

<body>

<div class="blob a"></div>
<div class="blob b"></div>
<div class="blob c"></div>

<div class="star a"></div>
<div class="star b"></div>
<div class="star c"></div>

<div class="phone">

<!-- =========================
     カレンダー画面
========================= -->

<div id="calendarPage">

<header class="header">

  <div class="logo">
    MY SPECIAL CALENDAR
  </div>

  <div class="title">
    2026 CALENDAR
  </div>

  <div class="subtitle">
    7月11日からはじまるカレンダー ♡
  </div>

  <div class="bubble"></div>

</header>

<main class="content">

  <div class="monthbar">

    <button class="circle-btn" onclick="changeMonth(-1)">
      ‹
    </button>

    <div class="monthtitle" id="monthTitle">
      2026年 7月
    </div>

    <button class="circle-btn" onclick="changeMonth(1)">
      ›
    </button>

  </div>

  <div class="calendar-card">

    <div class="weekdays">
      <div class="weekday">SUN</div>
      <div class="weekday">MON</div>
      <div class="weekday">TUE</div>
      <div class="weekday">WED</div>
      <div class="weekday">THU</div>
      <div class="weekday">FRI</div>
      <div class="weekday">SAT</div>
    </div>

    <div class="calendar" id="calendar">
      <div class="loading">
        カレンダーを読み込み中…♡
      </div>
    </div>

  </div>

  <button class="creator-button" onclick="openCreator()">
    🔐　製作者ページ
  </button>

  <div class="footer">
    made with ♡
  </div>

</main>
</div>


<!-- =========================
     製作者画面
========================= -->

<div id="creatorPage" class="creator-page">

<header class="header">

  <div class="logo">
    CREATOR MODE
  </div>

  <div class="title">
    製作者ページ
  </div>

  <div class="subtitle">
    カレンダーを編集できます ♡
  </div>

</header>

<main class="content">

<button class="back-button" onclick="backToCalendar()">
  ← カレンダーに戻る
</button>

<div class="card">

  <h2>✏️ カレンダー編集</h2>

  <div class="notice">
    日付と内容は必須です。<br>
    「終わった／まだやってない」と時間は任意で設定できます。
  </div>

  <label>
    📅 日付 *
  </label>

  <input
    type="date"
    id="creatorDate"
    min="2026-07-11"
  >

  <label>
    💌 内容 *
  </label>

  <textarea
    id="creatorText"
    placeholder="例：映画を見る&#10;18時からご飯♡"
  ></textarea>

  <label>
    💗 状態
  </label>

  <div class="status-buttons">

    <button
      id="todoButton"
      class="status-button selected todo"
      onclick="setStatus('todo')">
      🩷 まだやってない
    </button>

    <button
      id="doneButton"
      class="status-button"
      onclick="setStatus('done')">
      💚 終わった
    </button>

  </div>

  <div class="help">
    「終わった」にするとカレンダー上で緑色＋取り消し線になります。
  </div>

  <label>
    🕐 時間（任意）
  </label>

  <div class="time-row">

    <div>
      <div class="time-label">開始</div>
      <input type="time" id="startTime">
    </div>

    <div>
      <div class="time-label">終了</div>
      <input type="time" id="endTime">
    </div>

  </div>

  <div class="action-row">

    <button class="save-button" onclick="saveEvent()">
      ♡ 保存する
    </button>

    <button class="delete-button" onclick="deleteEvent()">
      削除
    </button>

  </div>

</div>

</main>
</div>

</div>


<!-- =========================
     パスワード
========================= -->

<div class="modal" id="passwordModal">

<div class="modal-box">

  <h2>🔐 製作者ページ</h2>

  <p>
    パスワードを入力してください。
  </p>

  <input
    type="password"
    id="passwordInput"
    placeholder="Password"
    onkeydown="
      if(event.key === 'Enter') checkPassword()
    "
  >

  <div class="modal-buttons">

    <button
      class="password-ok"
      onclick="checkPassword()">
      入る
    </button>

    <button
      class="password-cancel"
      onclick="closePassword()">
      キャンセル
    </button>

  </div>

</div>
</div>


<script type="module">

/* ==================================================
   Firebase
   ================================================== */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

import {
  getAuth,
  signInAnonymously
}
from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  set,
  remove,
  onValue
}
from "https://www.gstatic.com/firebasejs/12.5.0/firebase-database.js";


/*
=====================================================
ここだけFirebase Consoleの内容に置き換える
=====================================================
*/

const firebaseConfig = {

  apiKey: "ここにapiKey",

  authDomain:
    "ここにauthDomain",

  databaseURL:
    "ここにdatabaseURL",

  projectId:
    "ここにprojectId",

  storageBucket:
    "ここにstorageBucket",

  messagingSenderId:
    "ここにmessagingSenderId",

  appId:
    "ここにappId"
};


/* ==================================================
   Firebase初期化
   ================================================== */

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getDatabase(app);

let firebaseReady = false;

signInAnonymously(auth)
  .then(() => {

    firebaseReady = true;

    console.log(
      "Firebase connected"
    );

  })
  .catch(error => {

    console.error(error);

    alert(
      "Firebaseへの接続に失敗しました。\n" +
      "firebaseConfigとAuthentication設定を確認してください。"
    );

  });


/* ==================================================
   設定
   ================================================== */

const PASSWORD = "01300831";

const START_DATE =
  new Date(2026, 6, 11);

let currentYear = 2026;
let currentMonth = 6;

let events = {};

let selectedStatus = "todo";


/* ==================================================
   Firebaseからリアルタイム取得
   ================================================== */

const eventsRef =
  ref(db, "calendarEvents");

onValue(
  eventsRef,
  snapshot => {

    events =
      snapshot.val() || {};

    renderCalendar();

    loadCreatorEvent();

  },
  error => {

    console.error(error);

  }
);


/* ==================================================
   日付
   ================================================== */

function formatDate(date){

  const y =
    date.getFullYear();

  const m =
    String(
      date.getMonth() + 1
    ).padStart(2,"0");

  const d =
    String(
      date.getDate()
    ).padStart(2,"0");

  return `${y}-${m}-${d}`;
}


/* ==================================================
   カレンダー描画
   ================================================== */

function renderCalendar(){

  const calendar =
    document.getElementById("calendar");

  const title =
    document.getElementById("monthTitle");

  if(!calendar || !title){
    return;
  }

  calendar.innerHTML = "";

  title.textContent =
    `${currentYear}年 ${currentMonth + 1}月`;

  const firstDay =
    new Date(
      currentYear,
      currentMonth,
      1
    ).getDay();

  const daysInMonth =
    new Date(
      currentYear,
      currentMonth + 1,
      0
    ).getDate();


  for(let i=0;i<firstDay;i++){

    const empty =
      document.createElement("div");

    empty.className =
      "day disabled";

    calendar.appendChild(empty);
  }


  for(let day=1;day<=daysInMonth;day++){

    const date =
      new Date(
        currentYear,
        currentMonth,
        day
      );

    const dateString =
      formatDate(date);

    const cell =
      document.createElement("div");

    cell.className = "day";


    if(date < START_DATE){
      cell.classList.add("disabled");
    }


    if(date.getDay() === 0){
      cell.classList.add("sunday");
    }

    if(date.getDay() === 6){
      cell.classList.add("saturday");
    }


    if(
      currentYear === 2026 &&
      currentMonth === 6 &&
      day === 11
    ){

      cell.classList.add("start-day");

    }


    const number =
      document.createElement("div");

    number.className =
      "day-number";

    number.textContent =
      day;

    cell.appendChild(number);


    if(
      currentYear === 2026 &&
      currentMonth === 6 &&
      day === 11
    ){

      const start =
        document.createElement("span");

      start.className =
        "start-label";

      start.textContent =
        "START ♡";

      cell.appendChild(start);

    }


    const event =
      events[dateString];


    if(event){

      const eventBox =
        document.createElement("div");

      eventBox.className =
        "event";


      if(event.status === "done"){

        eventBox.classList.add("done");

      }


      eventBox.appendChild(
        document.createTextNode(
          event.text || ""
        )
      );


      if(
        event.startTime ||
        event.endTime
      ){

        const time =
          document.createElement("span");

        time.className =
          "event-time";


        if(
          event.startTime &&
          event.endTime
        ){

          time.textContent =
            `${event.startTime}〜${event.endTime}`;

        }
        else if(event.startTime){

          time.textContent =
            `${event.startTime}〜`;

        }
        else{

          time.textContent =
            `〜${event.endTime}`;

        }

        eventBox.appendChild(time);

      }


      cell.appendChild(eventBox);

    }


    calendar.appendChild(cell);

  }

}


/* ==================================================
   月変更
   ================================================== */

window.changeMonth =
function(amount){

  currentMonth += amount;


  if(currentMonth < 0){

    currentMonth = 11;
    currentYear--;

  }


  if(currentMonth > 11){

    currentMonth = 0;
    currentYear++;

  }


  renderCalendar();

};


/* ==================================================
   パスワード
   ================================================== */

window.openCreator =
function(){

  document.getElementById(
    "passwordModal"
  ).style.display = "flex";

  document.getElementById(
    "passwordInput"
  ).value = "";

  setTimeout(() => {

    document.getElementById(
      "passwordInput"
    ).focus();

  },100);

};


window.closePassword =
function(){

  document.getElementById(
    "passwordModal"
  ).style.display = "none";

};


window.checkPassword =
function(){

  const password =
    document.getElementById(
      "passwordInput"
    ).value;


  if(password === PASSWORD){

    closePassword();


    document.getElementById(
      "calendarPage"
    ).style.display = "none";


    document.getElementById(
      "creatorPage"
    ).style.display = "block";


    if(
      !document.getElementById(
        "creatorDate"
      ).value
    ){

      document.getElementById(
        "creatorDate"
      ).value = "2026-07-11";

    }


    loadCreatorEvent();

  }
  else{

    alert(
      "パスワードが違います。"
    );

  }

};


window.backToCalendar =
function(){

  document.getElementById(
    "creatorPage"
  ).style.display = "none";


  document.getElementById(
    "calendarPage"
  ).style.display = "block";


  renderCalendar();

};


/* ==================================================
   状態
   ================================================== */

window.setStatus =
function(status){

  selectedStatus =
    status;


  document.getElementById(
    "todoButton"
  ).classList.remove(
    "selected"
  );


  document.getElementById(
    "doneButton"
  ).classList.remove(
    "selected"
  );


  if(status === "todo"){

    document.getElementById(
      "todoButton"
    ).classList.add(
      "selected"
    );

  }
  else{

    document.getElementById(
      "doneButton"
    ).classList.add(
      "selected"
    );

  }

};


/* ==================================================
   編集する日付を変更
   ================================================== */

document.getElementById(
  "creatorDate"
).addEventListener(
  "change",
  loadCreatorEvent
);


/* ==================================================
   編集画面へ既存データを読み込む
   ================================================== */

function loadCreatorEvent(){

  const date =
    document.getElementById(
      "creatorDate"
    ).value;


  if(!date){
    return;
  }


  const event =
    events[date];


  if(!event){

    document.getElementById(
      "creatorText"
    ).value = "";

    document.getElementById(
      "startTime"
    ).value = "";

    document.getElementById(
      "endTime"
    ).value = "";

    setStatus("todo");

    return;
  }


  document.getElementById(
    "creatorText"
  ).value =
    event.text || "";


  document.getElementById(
    "startTime"
  ).value =
    event.startTime || "";


  document.getElementById(
    "endTime"
  ).value =
    event.endTime || "";


  setStatus(
    event.status || "todo"
  );

}


/* ==================================================
   保存
   ================================================== */

window.saveEvent =
async function(){

  const date =
    document.getElementById(
      "creatorDate"
    ).value;

  const text =
    document.getElementById(
      "creatorText"
    ).value.trim();

  const startTime =
    document.getElementById(
      "startTime"
    ).value;

  const endTime =
    document.getElementById(
      "endTime"
    ).value;


  if(!date){

    alert(
      "日付を選択してください。"
    );

    return;
  }


  if(!text){

    alert(
      "内容を入力してください。"
    );

    return;
  }


  if(!firebaseReady){

    alert(
      "Firebaseに接続中です。\n少し待ってからもう一度保存してください。"
    );

    return;
  }


  try{

    await set(
      ref(
        db,
        "calendarEvents/" + date
      ),
      {

        text:text,

        status:selectedStatus,

        startTime:
          startTime || "",

        endTime:
          endTime || "",

        updatedAt:
          Date.now()

      }
    );


    alert(
      "保存しました ♡"
    );

  }
  catch(error){

    console.error(error);

    alert(
      "保存できませんでした。\n" +
      error.message
    );

  }

};


/* ==================================================
   削除
   ================================================== */

window.deleteEvent =
async function(){

  const date =
    document.getElementById(
      "creatorDate"
    ).value;


  if(!date){
    return;
  }


  if(!events[date]){

    alert(
      "この日の予定はありません。"
    );

    return;
  }


  if(
    !confirm(
      "この日の予定を削除しますか？"
    )
  ){

    return;

  }


  try{

    await remove(
      ref(
        db,
        "calendarEvents/" + date
      )
    );


    document.getElementById(
      "creatorText"
    ).value = "";

    document.getElementById(
      "startTime"
    ).value = "";

    document.getElementById(
      "endTime"
    ).value = "";

    setStatus("todo");


    alert(
      "削除しました。"
    );

  }
  catch(error){

    console.error(error);

    alert(
      "削除できませんでした。\n" +
      error.message
    );

  }

};


/* ==================================================
   初期表示
   ================================================== */

renderCalendar();

</script>
