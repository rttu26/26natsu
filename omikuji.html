<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スマホおみくじ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at 20% 20%, #ffd6d6 0 8%, transparent 9%),
        radial-gradient(circle at 80% 70%, #ffe8a8 0 7%, transparent 8%),
        linear-gradient(135deg, #f8c8c8, #f9dfaa);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
    }

    /* スマホ本体 */
    .phone {
      position: relative;
      width: 330px;
      height: 650px;
      padding: 12px;
      border: 8px solid #222;
      border-radius: 45px;
      background: #222;
      box-shadow:
        0 25px 50px rgba(0, 0, 0, 0.3),
        inset 0 0 0 2px #555;
    }

    /* スマホ画面 */
    .screen {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 32px;
      background:
        linear-gradient(rgba(255,255,255,0.8), rgba(255,248,248,0.9)),
        #fff0f0;
    }

    /* ノッチ */
    .notch {
      position: absolute;
      z-index: 10;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 25px;
      border-radius: 20px;
      background: #111;
    }

    /* 画面の装飾 */
    .sakura {
      position: absolute;
      font-size: 35px;
      opacity: 0.45;
    }

    .sakura1 {
      top: 55px;
      left: 15px;
    }

    .sakura2 {
      top: 130px;
      right: 15px;
    }

    .sakura3 {
      bottom: 70px;
      left: 15px;
    }

    .sakura4 {
      bottom: 120px;
      right: 20px;
    }

    /* おみくじ */
    .omikuji {
      position: relative;
      z-index: 2;
      height: 100%;
      padding: 70px 25px 30px;
      text-align: center;
    }

    h1 {
      margin: 0;
      color: #b71c1c;
      font-size: 30px;
      text-shadow: 1px 1px white;
    }

    .subtitle {
      margin: 8px 0 20px;
      color: #777;
      font-size: 13px;
    }

    .result-box {
      min-height: 250px;
      padding: 25px 15px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 3px solid #c62828;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 5px 15px rgba(180, 50, 50, 0.15);
    }

    #result {
      font-size: 55px;
      font-weight: bold;
      color: #c62828;
    }

    #message {
      margin-top: 15px;
      color: #555;
      font-size: 14px;
      line-height: 1.7;
    }

    button {
      margin-top: 25px;
      padding: 15px 25px;
      width: 100%;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, #d32f2f, #b71c1c);
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 10px rgba(180, 30, 30, 0.3);
      transition: 0.2s;
    }

    button:hover {
      transform: scale(1.04);
    }

    button:active {
      transform: scale(0.96);
    }

    .bottom {
      margin-top: 18px;
      font-size: 12px;
      color: #999;
    }

    /* スマホ下部のホームバー */
    .home-bar {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 4px;
      border-radius: 10px;
      background: #333;
    }
  </style>
</head>

<body>

  <div class="phone">

    <div class="notch"></div>

    <div class="screen">

      <!-- 背景の桜 -->
      <div class="sakura sakura1">🌸</div>
      <div class="sakura sakura2">🌸</div>
      <div class="sakura sakura3">🌸</div>
      <div class="sakura sakura4">🌸</div>

      <!-- おみくじ本体 -->
      <div class="omikuji">

        <h1>🎋 おみくじ 🎋</h1>

        <div class="subtitle">
          今日のあなたの運勢は？
        </div>

        <div class="result-box">
          <div id="result">？？？</div>

          <div id="message">
            ボタンを押して<br>
            運勢を占おう！
          </div>
        </div>

        <button onclick="drawOmikuji()">
          🎋 おみくじを引く！
        </button>

        <div class="bottom">
          今日も素敵な一日を ✨
        </div>

      </div>

      <div class="home-bar"></div>

    </div>
  </div>


  <script>
    const fortunes = [
      {
        name: "大吉",
        message: "最高の運勢！<br>何事にも積極的に挑戦しよう！"
      },
      {
        name: "中吉",
        message: "いいことが起こりそう。<br>笑顔を大切に！"
      },
      {
        name: "小吉",
        message: "小さな幸せを<br>見つけられる一日になりそう。"
      },
      {
        name: "吉",
        message: "落ち着いて行動すれば、<br>きっと良い結果に！"
      },
      {
        name: "末吉",
        message: "これから運気が<br>上がっていく予感！"
      },
      {
        name: "凶",
        message: "焦らず慎重に。<br>明日はきっと良くなる！"
      }
    ];

    function drawOmikuji() {

      const randomIndex =
        Math.floor(Math.random() * fortunes.length);

      const fortune = fortunes[randomIndex];

      document.getElementById("result").innerHTML =
        fortune.name;

      document.getElementById("message").innerHTML =
        fortune.message;
    }
  </script>

</body>
</html>
