const cardsContainer =

const cards =

);

/*
カードの位置をシャッフル
Fisher-Yates方式
*/
for (
let i = cards.length - 1;
i > 0;
i--
) {

const j =
Math.floor(
  Math.random() * (i + 1)
);

[
  cards[i],
  cards[j]
] = [
  cards[j],
  cards[i]
];

}

/*
シャッフルした順番で
.cardsの中に戻す
*/
cards.forEach(card => {

cardsContainer.appendChild(card);

});

/*
カード状態をリセット
*/
cards.forEach(card => {

card.classList.remove(
  "selected",
  "disabled"
);

card.querySelector(
  ".card-result"
).textContent = "";

card.querySelector(
  ".card-detail"
).textContent = "";

});

/*

*/
document.getElementById(
"fortune"

}

["💘 恋愛成就", "あなたの恋が実るチャンス！"],
["🌸 片思い吉", "少しずつ距離を縮めてみよう。"],
["💌 連絡吉", "今日は連絡運が絶好調！"],
["💗 恋の予感", "思いがけない出会いがありそう。"],
["💞 相性◎", "二人の相性はとても良さそう。"],
["💓 告白吉", "勇気を出すと恋が動くかも。"],
["💔 恋愛注意", "焦らず相手の気持ちを考えてみよう。"]

];

const darkFortunes = [

["凶", "今日は無理をしないほうがよさそう。"],
["大凶", "何かが起こる前触れかもしれない。"],
["闇", "あなたの知らないところで運命が動いている。"],
["警告", "その選択、本当に間違っていない？"],
["呪", "今日は慎重に。軽い気持ちの行動は禁物。"],
["絶望", "今は耐える時。夜明けはまだ遠い。"],
["秘密", "知らないほうが幸せなこともある。"],
["破滅", "欲張りすぎると全てを失うかも。"],
["？？？", "この結果の意味を知るのは、あなた自身。"]

];

let currentMode = "normal";
let selected = false;

/* =========================
パスコード設定
========================= */

const creatorPassword = "0831";

let enteredPassword = "";

/*
4回間違えると24時間ロック
*/

const MAX_MISTAKES = 4;

const LOCK_TIME =
24 * 60 * 60 * 1000;

/*
ブラウザに保存するデータ
*/

let wrongCount =
Number(
localStorage.getItem(
"omikujiWrongCount"
)
) || 0;

let lockUntil =
Number(
localStorage.getItem(
"omikujiLockUntil"
)
) || 0;

/* =========================
モード変更
========================= */

function changeMode(mode) {

currentMode = mode;

const screen =
document.getElementById("screen");

document
.getElementById("normalButton")
.classList.remove("active");

document
.getElementById("loveButton")
.classList.remove("active");

document
.getElementById("darkButton")
.classList.remove("active");

screen.classList.remove(
"love-mode",
"dark-mode"
);

if (mode === "love") {

screen.classList.add("love-mode");

document
  .getElementById("loveButton")
  .classList.add("active");

document.getElementById("title")
  .textContent =
  "💕 恋みくじ 💕";

}

else if (mode === "dark") {

screen.classList.add("dark-mode");

document
  .getElementById("darkButton")
  .classList.add("active");

document.getElementById("title")
  .textContent =
  "☠ 闇みくじ ☠";

}

else {

document
  .getElementById("normalButton")
  .classList.add("active");

document.getElementById("title")
  .textContent =
  "🎋 おみくじ 🎋";

}

resetCards();
}

/* =========================
カード選択
========================= */

function selectCard(index, event) {

if (selected) return;

selected = true;

const cards =
document.querySelectorAll(".card");

let list;

if (currentMode === "love") {

list = loveFortunes;

}

else if (currentMode === "dark") {

list = darkFortunes;

}

else {

list = normalFortunes;

}

let fortune;

/* Shiftの裏技 */

if (event && event.shiftKey) {

if (currentMode === "love") {

  fortune = [
    "💖 大恋愛",
    "運命の恋が動き出す予感！"
  ];

}

else if (currentMode === "dark") {

  fortune = [
    "☠ 真・闇",
    "あなたは禁断の領域に足を踏み入れた。"
  ];

}

else {

  fortune = [
    "大吉",
    "最高の運勢！今日は何をしてもうまくいきそう！"
  ];

}

}

else {

fortune = list[index];

}

cards[index]
.classList.add("selected");

cards.forEach((card, i) => {

if (i !== index) {

  card.classList.add("disabled");

}

});

cards[index]
.querySelector(".card-result")
.textContent =
fortune[0];

cards[index]
.querySelector(".card-detail")
.textContent =
fortune[1];

setTimeout(() => {

showBigResult(fortune);

}, 700);

}

/* =========================
結果表示
========================= */

function showBigResult(fortune) {

const resultScreen =
document.getElementById(
"resultScreen"
);

document.getElementById(
"bigResult"
).textContent =
fortune[0];

document.getElementById(
"bigMessage"
).textContent =
fortune[1];

resultScreen.classList.remove(
"normal-result",
"dark-result"
);

if (currentMode === "normal") {

resultScreen.classList.add(
  "normal-result"
);

document.getElementById(
  "resultIcon"
).textContent =
  "🎋";

}

else if (currentMode === "love") {

document.getElementById(
  "resultIcon"
).textContent =
  "💕";

}

else {

resultScreen.classList.add(
  "dark-result"
);

document.getElementById(
  "resultIcon"
).textContent =
  "☠";

}

resultScreen.classList.add("show");

createSparkles();

}

/* =========================
結果を閉じる
========================= */

function closeResult() {

document
.getElementById("resultScreen")
.classList.remove("show");

setTimeout(() => {

/*
  闇みくじを1回引いたら
  自動的にロックする
*/

if (currentMode === "dark") {

  lockDarkFortune();

}

resetCards();

}, 300);

}

/* =========================
闇みくじをロック
========================= */

function lockDarkFortune() {

/*
闇みくじボタンを消す
*/

document
.getElementById("darkButton")
.style.display =
"none";

/*
通常のおみくじへ戻す
*/

changeMode("normal");

}

/* =========================
リセット
========================= */

function resetCards() {

selected = false;

document
.querySelectorAll(".card")
.forEach(card => {

  card.classList.remove(
    "selected",
    "disabled"
  );

  card.querySelector(
    ".card-result"
  ).textContent = "";

  card.querySelector(
    ".card-detail"
  ).textContent = "";

});

document.getElementById(
"fortune"
).textContent =
"？？？";

document.getElementById(
"message"
).textContent =

currentMode === "love"

  ? "カードを1枚選んでください 💕"

  : currentMode === "dark"

  ? "闇に触れるカードを1枚選んでください ☠"

  : "カードを1枚選んでください ✨";

}

/* =========================
キラキラ
========================= */

function createSparkles() {

const screen =
document.getElementById(
"screen"
);

let symbols;

if (currentMode === "love") {

symbols = [
  "💕",
  "💗",
  "✨",
  "💖",
  "💘"
];

}

else if (currentMode === "dark") {

symbols = [
  "☠",
  "🩸",
  "⚫",
  "🔻"
];

}

else {

symbols = [
  "✨",
  "🌸",
  "🎋",
  "⭐"
];

}

for (
let i = 0;
i < 14;
i++
) {

const sparkle =
  document.createElement(
    "div"
  );

sparkle.className =
  "sparkle";

sparkle.textContent =
  symbols[
    Math.floor(
      Math.random() *
      symbols.length
    )
  ];

sparkle.style.left =
  (10 +
   Math.random() * 80)
  + "%";

sparkle.style.top =
  (15 +
   Math.random() * 70)
  + "%";

sparkle.style.animationDelay =
  (Math.random() * .5)
  + "s";

screen.appendChild(
  sparkle
);

setTimeout(
  () => sparkle.remove(),
  1600
);

}

}

/* =========================
製作者ボタン
========================= */

function openLock() {

/*
24時間ロック中か確認
*/

if (isLocked()) {

showLockedMessage();

return;

}

enteredPassword = "";

updateDots();

document
.getElementById("lockError")
.classList.remove("show");

document
.getElementById("lockScreen")
.classList.add("show");

}

/* =========================
数字入力
========================= */

function pressKey(number) {

if (
enteredPassword.length >=
creatorPassword.length
) {
return;
}

enteredPassword += number;

updateDots();

if (
enteredPassword.length ===
creatorPassword.length
) {

setTimeout(
  checkPassword,
  180
);

}

}

/* =========================
削除
========================= */

function deleteKey() {

enteredPassword =
enteredPassword.slice(
0,
-1
);

updateDots();

}

/* =========================
●表示
========================= */

function updateDots() {

const dots =
document.querySelectorAll(
".pass-dot"
);

dots.forEach(
(dot, index) => {

  dot.classList.toggle(
    "filled",
    index <
    enteredPassword.length
  );

}

);

}

/* =========================
パスワード確認
========================= */

function checkPassword() {

if (
enteredPassword ===
creatorPassword
) {

/*
  正解したらミス回数をリセット
*/

wrongCount = 0;

localStorage.setItem(
  "omikujiWrongCount",
  "0"
);

unlockDarkFortune();

}

else {

wrongCount++;

localStorage.setItem(
  "omikujiWrongCount",
  String(wrongCount)
);

const error =
  document.getElementById(
    "lockError"
  );

error.classList.remove(
  "show"
);

void error.offsetWidth;

error.classList.add(
  "show"
);

enteredPassword = "";

updateDots();

/*
  4回間違えたらロック
*/

if (
  wrongCount >=
  MAX_MISTAKES
) {

  start24HourLock();

}

}

}

/* =========================
闇みくじ解放
========================= */

function unlockDarkFortune() {

document
.getElementById("lockScreen")
.classList.remove("show");

document
.getElementById("darkButton")
.style.display =
"block";

changeMode("dark");

}

/* =========================
パスコード画面を閉じる
========================= */

function closeLock() {

document
.getElementById("lockScreen")
.classList.remove("show");

}

/* =========================
24時間ロック開始
========================= */

function start24HourLock() {

lockUntil =
Date.now() +
LOCK_TIME;

localStorage.setItem(
"omikujiLockUntil",
String(lockUntil)
);

enteredPassword = "";

updateDots();

document
.getElementById("lockScreen")
.classList.remove("show");

setTimeout(() => {

showLockedMessage();

}, 250);

}

/* =========================
ロック確認
========================= */

function isLocked() {

const now =
Date.now();

if (
lockUntil &&
now < lockUntil
) {

return true;

}

/*
24時間経過したら解除
*/

if (
lockUntil &&
now >= lockUntil
) {

lockUntil = 0;

wrongCount = 0;

localStorage.removeItem(
  "omikujiLockUntil"
);

localStorage.setItem(
  "omikujiWrongCount",
  "0"
);

}

return false;

}

/* =========================
ロック画面
========================= */

function showLockedMessage() {

updateRemainingTime();

document
.getElementById(
"lockedMessage"
)
.classList.add("show");

}

/* =========================
残り時間
========================= */

function updateRemainingTime() {

if (!isLocked()) {

closeLockedMessage();

return;

}

const remaining =
lockUntil -
Date.now();

const hours =
Math.floor(
remaining /
(1000 * 60 * 60)
);

const minutes =
Math.floor(
(remaining %
(1000 * 60 * 60)) /
(1000 * 60)
);

const seconds =
Math.floor(
(remaining %
(1000 * 60)) /
1000
);

document.getElementById(
"remainingTime"
).textContent =

"解除まで " +
hours +
"時間 " +
minutes +
"分 " +
seconds +
"秒";

setTimeout(
updateRemainingTime,
1000
);

}

/* =========================
ロック画面を閉じる
========================= */

function closeLockedMessage() {

document
.getElementById(
"lockedMessage"
)
.classList.remove("show");

}

/* =========================
ページ読み込み時
========================= */

window.addEventListener(
"load",
() => {

/*
  すでに24時間ロック中なら
  その状態を維持
*/

if (isLocked()) {

  /*
    製作者ボタンは残すが、
    押すとロック画面になる
  */

}

}
);
