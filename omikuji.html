<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>おみくじ＆恋みくじ＆ラッキーカラー</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    radial-gradient(circle at 20% 20%, #ffd6d6 0 4%, transparent 5%),
    radial-gradient(circle at 80% 70%, #ffe7b3 0 5%, transparent 6%),
    linear-gradient(135deg, #f6c5c5, #ffe6ad);
  font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
}

.phone {
  position: relative;
  width: 350px;
  height: 700px;
  padding: 10px;
  background: #222;
  border: 7px solid #111;
  border-radius: 50px;
  box-shadow: 0 25px 55px rgba(0,0,0,.3);
}

.notch {
  position: absolute;
  z-index: 300;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: 105px;
  height: 25px;
  border-radius: 20px;
  background: #111;
}

.screen {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  border-radius: 37px;
  background:
    linear-gradient(
      rgba(255,255,255,.75),
      rgba(255,248,245,.9)
    ),
    #fff0f0;
}

.content {
  position: relative;
  z-index: 2;
  padding: 55px 17px 25px;
  text-align: center;
}

h1 {
  margin: 0;
  color: #b71c1c;
  font-size: 27px;
}

.subtitle {
  margin: 5px 0 12px;
  color: #777;
  font-size: 11px;
}

/* 桜 */

.sakura {
  position: absolute;
  font-size: 35px;
  opacity: .35;
}

.s1 {
  top: 65px;
  left: 10px;
}

.s2 {
  top: 135px;
  right: 10px;
}

.s3 {
  bottom: 90px;
  left: 12px;
}

.s4 {
  bottom: 145px;
  right: 12px;
}

/* モード */

.mode-buttons {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
}

.mode-buttons button {
  flex: 1;
  padding: 8px 2px;
  border: 0;
  border-radius: 30px;
  background: #eee;
  color: #777;
  font-size: 10px;
  cursor: pointer;
  transition: .2s;
}

.mode-buttons button:hover {
  transform: translateY(-2px);
}

.mode-buttons button.active {
  background: #c62828;
  color: white;
}

.mode-buttons button.love.active {
  background: #e91e63;
}

.mode-buttons button.color.active {
  background: #7b1fa2;
}

/* カード */

.cards {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
  perspective: 1000px;
}

.card {
  height: 100px;
  position: relative;
  cursor: pointer;
  perspective: 800px;
  transition: transform .2s;
}

.card:hover {
  transform: translateY(-4px);
}

.card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform .75s cubic-bezier(.2,.7,.2,1);
  transform-style: preserve-3d;
}

.card.selected .card-inner {
  transform: rotateY(180deg);
}

.card-front,
.card-back {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  border-radius: 10px;
  overflow: hidden;
}

.card-back {
  display: flex;
  justify-content: center;
  align-items: center;

  background:
    repeating-linear-gradient(
      45deg,
      transparent,
      transparent 5px,
      rgba(255,255,255,.12) 6px,
      transparent 7px
    ),
    #b71c1c;

  border: 3px solid #f4c76b;
  box-shadow: 0 5px 10px rgba(0,0,0,.2);
}

.card-back::before {
  content: "🎋";
  font-size: 27px;
}

.love-mode .card-back {
  background:
    repeating-linear-gradient(
      45deg,
      transparent,
      transparent 5px,
      rgba(255,255,255,.12) 6px,
      transparent 7px
    ),
    #c2185b;

  border-color: #ffd1df;
}

.love-mode .card-back::before {
  content: "💗";
}

.color-mode .card-back {
  background:
    repeating-linear-gradient(
      45deg,
      transparent,
      transparent 5px,
      rgba(255,255,255,.12) 6px,
      transparent 7px
    ),
    #7b1fa2;

  border-color: #e1bee7;
}

.color-mode .card-back::before {
  content: "🎨";
}

/* 表 */

.card-front {
  transform: rotateY(180deg);

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  padding: 4px;

  background:
    linear-gradient(135deg,#fffdf2,#fff5d8);

  border: 3px solid #d4aa48;
  box-shadow: 0 5px 15px rgba(0,0,0,.2);
}

.card-front::before {
  content: "御神籤";
  color: #9b751b;
  font-size: 7px;
  margin-bottom: 3px;
}

.love-mode .card-front {
  background:
    linear-gradient(135deg,#fff8fb,#ffe3ed);
  border-color: #e57399;
}

.love-mode .card-front::before {
  content: "恋みくじ";
  color: #c2185b;
}

.color-mode .card-front {
  background:
    linear-gradient(135deg,#fbf5ff,#eee0ff);
  border-color: #9c6ade;
}

.color-mode .card-front::before {
  content: "ラッキーカラー";
  color: #7b1fa2;
}

.card-result {
  color: #b71c1c;
  font-size: 13px;
  font-weight: bold;
  text-align: center;
}

.love-mode .card-result {
  color: #e91e63;
}

.color-mode .card-result {
  color: #7b1fa2;
}

.card-detail {
  margin-top: 3px;
  color: #666;
  font-size: 7px;
  line-height: 1.3;
  text-align: center;
}

.card.disabled {
  pointer-events: none;
  opacity: .22;
}

.card.selected {
  transform: translateY(-7px);
}

.card.selected .card-front {
  box-shadow:
    0 0 0 3px #ffd54f,
    0 8px 20px rgba(255,80,80,.35);
}

/* 結果欄 */

.result-box {
  min-height: 72px;
  margin-top: 12px;
  padding: 8px;

  border: 2px solid #c62828;
  border-radius: 15px;

  background: rgba(255,255,255,.94);
}

.love-mode .result-box {
  border-color: #e91e63;
}

.color-mode .result-box {
  border-color: #7b1fa2;
}

#fortune {
  color: #c62828;
  font-size: 23px;
  font-weight: bold;
}

.love-mode #fortune {
  color: #e91e63;
}

.color-mode #fortune {
  color: #7b1fa2;
}

#message {
  margin-top: 3px;
  color: #555;
  font-size: 9px;
  line-height: 1.4;
}

.cooldown {
  margin-top: 5px;
  color: #999;
  font-size: 8px;
}

/* ボタン */

#resetButton {
  width: 100%;
  margin-top: 9px;
  padding: 11px;

  border: 0;
  border-radius: 50px;

  background:
    linear-gradient(135deg,#d32f2f,#a91515);

  color: white;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

.love-mode #resetButton {
  background:
    linear-gradient(135deg,#ec407a,#c2185b);
}

.color-mode #resetButton {
  background:
    linear-gradient(135deg,#9c27b0,#6a1b9a);
}

/* 製作者ページボタン */

.creator-button {
  position: absolute;
  z-index: 20;

  right: 15px;
  bottom: 38px;

  border: 0;

  background:
    linear-gradient(135deg,#222,#000);

  color: #ff5252;

  padding: 7px 12px;
  border-radius: 20px;

  font-size: 9px;
  font-weight: bold;

  cursor: pointer;

  box-shadow:
    0 0 12px rgba(255,0,0,.35);

  transition: .2s;
}

.creator-button:hover {
  transform: scale(1.08);
  box-shadow:
    0 0 18px rgba(255,0,0,.65);
}

/* 全画面結果 */

.result-screen {
  position: absolute;
  z-index: 100;

  inset: 0;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  padding: 30px;

  text-align: center;

  background:
    radial-gradient(
      circle at center,
      #fff,
      #ffe8ef 45%,
      #f8b6c9
    );

  transform: scale(0);
  opacity: 0;
  pointer-events: none;
}

.result-screen.show {
  animation:
    resultBang .65s cubic-bezier(.15,1.5,.3,1)
    forwards;

  pointer-events: auto;
}

@keyframes resultBang {

  0% {
    transform: scale(0);
    opacity: 0;
  }

  55% {
    transform: scale(1.08);
    opacity: 1;
  }

  75% {
    transform: scale(.97);
  }

  100% {
    transform: scale(1);
    opacity: 1;
  }
}

.normal-result {
  background:
    radial-gradient(
      circle at center,
      #fff,
      #fff5d0 45%,
      #f2d27a
    );
}

.color-result {
  background:
    radial-gradient(
      circle at center,
      #fff,
      #f1e0ff 45%,
      #cda4ed
    );
}

.result-icon {
  font-size: 65px;
  margin-bottom: 10px;

  animation:
    iconPop .7s .2s both;
}

@keyframes iconPop {

  0% {
    transform: scale(0) rotate(-20deg);
  }

  70% {
    transform: scale(1.2) rotate(10deg);
  }

  100% {
    transform: scale(1) rotate(0);
  }
}

.result-title {
  color: #e91e63;

  font-size: 43px;
  font-weight: bold;

  text-shadow:
    2px 2px 0 white,
    0 0 15px rgba(233,30,99,.3);

  animation:
    titlePop .7s .1s both;
}

.normal-result .result-title {
  color: #c62828;
}

.color-result .result-title {
  color: #7b1fa2;
}

@keyframes titlePop {

  0% {
    transform: scale(2);
    opacity: 0;
  }

  100% {
    transform: scale(1);
    opacity: 1;
  }
}

.result-line {
  width: 150px;
  height: 2px;

  margin: 15px 0;

  background: #e57399;
}

.normal-result .result-line {
  background: #d4aa48;
}

.color-result .result-line {
  background: #9c6ade;
}

.result-message {
  max-width: 260px;

  color: #555;

  font-size: 16px;
  line-height: 1.8;
}

.result-screen button {
  width: 200px;

  margin-top: 30px;

  padding: 13px;

  border: 0;
  border-radius: 50px;

  background: #e91e63;

  color: white;

  font-size: 15px;
  font-weight: bold;

  cursor: pointer;
}

.normal-result button {
  background: #c62828;
}

.color-result button {
  background: #7b1fa2;
}

/* キラキラ */

.sparkle {
  position: absolute;

  z-index: 150;

  pointer-events: none;

  font-size: 24px;

  animation:
    sparkle 1s ease-out forwards;
}

@keyframes sparkle {

  0% {
    transform: scale(.2);
    opacity: 0;
  }

  30% {
    opacity: 1;
  }

  100% {
    transform:
      translateY(-45px)
      scale(1.4);

    opacity: 0;
  }
}

/* ホームバー */

.home-bar {
  position: absolute;

  bottom: 8px;
  left: 50%;

  transform: translateX(-50%);

  width: 100px;
  height: 4px;

  border-radius: 10px;

  background: #333;
}

/* ================================
   パスコード画面
================================ */

.lock-screen {
  position: absolute;

  z-index: 500;

  inset: 0;

  display: flex;
  flex-direction: column;
  align-items: center;

  padding-top: 55px;

  background:
    linear-gradient(
      rgba(15,15,20,.97),
      rgba(5,5,10,.99)
    );

  color: white;

  opacity: 0;
  pointer-events: none;

  transition: opacity .25s;
}

.lock-screen.show {
  opacity: 1;
  pointer-events: auto;
}

.lock-title {
  font-size: 16px;
  margin-bottom: 8px;
}

.lock-subtitle {
  color: #aaa;
  font-size: 10px;
  margin-bottom: 20px;
}

/* 12個のドット */

.pass-dots {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;

  gap: 8px;

  width: 150px;
  min-height: 30px;

  margin-bottom: 20px;
}

.pass-dot {
  width: 8px;
  height: 8px;

  border-radius: 50%;

  border: 1px solid #aaa;
}

.pass-dot.filled {
  background: white;
}

/* キーパッド */

.keypad {
  display: grid;

  grid-template-columns:
    repeat(3,65px);

  gap: 13px;
}

.key {
  width: 65px;
  height: 65px;

  border: 0;
  border-radius: 50%;

  background:
    rgba(255,255,255,.13);

  color: white;

  font-size: 22px;

  cursor: pointer;
}

.key:active {
  background:
    rgba(255,255,255,.35);

  transform: scale(.94);
}

.key.empty {
  background: transparent;
  cursor: default;
}

.lock-cancel {
  margin-top: 18px;

  border: 0;

  background: transparent;

  color: #aaa;

  font-size: 11px;

  cursor: pointer;
}

.lock-error {
  margin-top: 12px;

  color: #ff5252;

  font-size: 10px;

  min-height: 14px;

  text-align: center;
}

.lock-error.show {
  animation:
    errorShake .35s;

  opacity: 1;
}

@keyframes errorShake {

  0%,100% {
    transform: translateX(0);
  }

  25% {
    transform: translateX(-8px);
  }

  75% {
    transform: translateX(8px);
  }
}

/* 製作者ページ */

.creator-page {
  position: absolute;

  z-index: 600;

  inset: 0;

  display: flex;
  flex-direction: column;

  align-items: center;

  padding: 55px 20px 20px;

  background:
    linear-gradient(
      145deg,
      #161616,
      #050505
    );

  color: white;

  opacity: 0;
  pointer-events: none;

  transition: opacity .3s;

  overflow-y: auto;
}

.creator-page.show {
  opacity: 1;
  pointer-events: auto;
}

.creator-title {
  color: #ff4444;

  font-size: 24px;
  font-weight: bold;

  margin-bottom: 4px;
}

.creator-subtitle {
  color: #999;

  font-size: 9px;

  margin-bottom: 20px;
}

.creator-card {
  width: 100%;

  padding: 13px;

  margin-bottom: 10px;

  border-radius: 15px;

  background:
    linear-gradient(
      135deg,
      #222,
      #101010
    );

  border: 1px solid #444;

  box-shadow:
    0 5px 15px rgba(0,0,0,.4);
}

.creator-card-title {
  font-size: 13px;
  font-weight: bold;

  margin-bottom: 5px;
}

.creator-status {
  color: #aaa;

  font-size: 9px;

  margin-bottom: 9px;
}

.creator-reset {
  width: 100%;

  padding: 8px;

  border: 0;

  border-radius: 30px;

  background: #8b0000;

  color: white;

  font-size: 10px;

  font-weight: bold;

  cursor: pointer;
}

.creator-reset:hover {
  background: #b71c1c;
}

.creator-close {
  margin-top: 8px;

  padding: 9px 25px;

  border: 1px solid #555;

  border-radius: 30px;

  background: transparent;

  color: #aaa;

  cursor: pointer;
}

/* 12時間ロック中 */

.cooldown-screen {
  position: absolute;

  z-index: 400;

  inset: 0;

  display: flex;
  flex-direction: column;

  justify-content: center;
  align-items: center;

  padding: 30px;

  text-align: center;

  background:
    rgba(255,255,255,.97);

  opacity: 0;
  pointer-events: none;

  transition: .25s;
}

.cooldown-screen.show {
  opacity: 1;
  pointer-events: auto;
}

.cooldown-icon {
  font-size: 55px;
  margin-bottom: 12px;
}

.cooldown-title {
  color: #b71c1c;

  font-size: 20px;
  font-weight: bold;
}

.cooldown-text {
  margin-top: 10px;

  color: #666;

  font-size: 11px;

  line-height: 1.8;
}

.cooldown-close {
  margin-top: 25px;

  padding: 10px 30px;

  border: 0;

  border-radius: 30px;

  background: #333;

  color: white;

  cursor: pointer;
}

/* ================================
   パスコード24時間ロック画面
================================ */

.password-lock-screen {
  position: absolute;

  z-index: 700;

  inset: 0;

  display: flex;
  flex-direction: column;

  justify-content: center;
  align-items: center;

  padding: 30px;

  text-align: center;

  background:
    linear-gradient(
      145deg,
      #100000,
      #050505
    );

  color: white;

  opacity: 0;
  pointer-events: none;

  transition: opacity .25s;
}

.password-lock-screen.show {
  opacity: 1;
  pointer-events: auto;
}

.password-lock-icon {
  font-size: 55px;
  margin-bottom: 15px;
}

.password-lock-title {
  color: #ff5252;

  font-size: 20px;
  font-weight: bold;
}

.password-lock-text {
  margin-top: 12px;

  color: #bbb;

  font-size: 11px;

  line-height: 1.8;
}

.password-lock-time {
  margin-top: 15px;

  color: #ff7777;

  font-size: 14px;

  font-weight: bold;
}

.password-lock-close {
  margin-top: 25px;

  padding: 10px 30px;

  border: 0;

  border-radius: 30px;

  background: #555;

  color: white;

  cursor: pointer;
}

</style>
</head>

 12桁以上入力できない
*/

if(
enteredPassword.length >=
creatorPassword.length
){

return;

}

enteredPassword += number;

updateDots();


/*
 12桁入力したら自動チェック
*/

if(
enteredPassword.length ===
creatorPassword.length
){

setTimeout(
checkPassword,
180
);

}

}


/* =========================================================
   1文字削除
========================================================= */

function deleteKey() {

if(isPasswordLocked()) {

return;

}

enteredPassword =
enteredPassword.slice(0,-1);

updateDots();

}


/* =========================================================
   ドット更新
========================================================= */

function updateDots() {

const dots =
document.querySelectorAll(
".pass-dot"
);

dots.forEach(
(dot,index) => {

dot.classList.toggle(
"filled",
index <
enteredPassword.length
);

});

}


/* =========================================================
   パスコード確認
========================================================= */

function checkPassword() {

if(isPasswordLocked()) {

showPasswordLock();

enteredPassword = "";

updateDots();

return;

}


/* 正解 */

if(
enteredPassword ===
creatorPassword
){

/*
 正解したら
 間違い回数をリセット
*/

localStorage.removeItem(
passwordAttemptsKey
);

localStorage.removeItem(
passwordLockKey
);

document
.getElementById("lockScreen")
.classList.remove("show");

enteredPassword = "";

updateDots();

openCreatorPage();

}

else {

/*
 間違い回数を1増やす
*/

let attempts =
Number(
localStorage.getItem(
passwordAttemptsKey
)
) || 0;

attempts++;

localStorage.setItem(
passwordAttemptsKey,
String(attempts)
);


/*
 エラー表示
*/

const error =
document.getElementById(
"lockError"
);

error.textContent =
"パスコードが違います（" +
attempts +
"/" +
PASSWORD_MAX_ATTEMPTS +
"回）";

error.classList.remove("show");

void error.offsetWidth;

error.classList.add("show");


enteredPassword = "";

updateDots();


/*
 4回間違えた
*/

if(
attempts >=
PASSWORD_MAX_ATTEMPTS
){

/*
 24時間後の時刻を保存
*/

const lockEnd =
Date.now() +
PASSWORD_LOCK_TIME;

localStorage.setItem(
passwordLockKey,
String(lockEnd)
);

/*
 間違い回数はリセット
*/

localStorage.removeItem(
passwordAttemptsKey
);

/*
 少し待ってから
 ロック画面を表示
*/

setTimeout(function(){

showPasswordLock();

},500);

}

}

}


/* =========================================================
   パスコード画面を閉じる
========================================================= */

function closeLock() {

document
.getElementById("lockScreen")
.classList.remove("show");

enteredPassword = "";

updateDots();

}


/* =========================================================
   製作者ページ
========================================================= */

function openCreatorPage() {

document
.getElementById("creatorPage")
.classList.add("show");

updateCreatorStatus();

}


function closeCreatorPage() {

document
.getElementById("creatorPage")
.classList.remove("show");

}


function updateCreatorStatus() {

document
.getElementById("normalStatus")
.textContent =
getAdminStatus("normal");

document
.getElementById("loveStatus")
.textContent =
getAdminStatus("love");

document
.getElementById("colorStatus")
.textContent =
getAdminStatus("color");

}


function getAdminStatus(mode) {

if(!isCooldown(mode)) {

return "✅ 現在、いつでも引けます";

}

return "⏳ " +
getRemainingText(mode) +
" 利用可能";

}


/* =========================================================
   製作者ページから個別リセット
========================================================= */

function adminReset(mode) {

localStorage.removeItem(
cooldownKeys[mode]
);

updateCreatorStatus();

if(mode === currentMode) {

updateCooldownText();

}

alert(
"12時間制限をリセットしました♡"
);

}


/* =========================================================
   全部リセット
========================================================= */

function adminResetAll() {

localStorage.removeItem(
cooldownKeys.normal
);

localStorage.removeItem(
cooldownKeys.love
);

localStorage.removeItem(
cooldownKeys.color
);

updateCreatorStatus();

updateCooldownText();

alert(
"すべての12時間制限をリセットしました♡"
);

}


/* =========================================================
   初期化
========================================================= */

window.addEventListener(
"load",
function(){

resetCards();

setInterval(
function(){

updateCooldownText();

updatePasswordLockTime();

if(
document
.getElementById(
"creatorPage"
)
.classList.contains("show")
){

updateCreatorStatus();

}

},
1000
);

}
);

</script>
