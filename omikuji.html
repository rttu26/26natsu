<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎋 おみくじ</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #f8c8c8, #ffe5ad);
  font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
}

/* スマホ */
.phone {
  position: relative;
  width: 340px;
  height: 680px;
  padding: 10px;
  background: #222;
  border: 7px solid #111;
  border-radius: 48px;
  box-shadow: 0 25px 50px rgba(0,0,0,.3);
}

.notch {
  position: absolute;
  z-index: 10;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: 105px;
  height: 25px;
  border-radius: 20px;
  background: #111;
}

.screen {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  border-radius: 35px;
  background:
    radial-gradient(circle at 15% 20%, #ffd4d4 0 5%, transparent 6%),
    radial-gradient(circle at 85% 30%, #ffe5b5 0 5%, transparent 6%),
    #fff7f4;
}

/* 桜 */
.sakura {
  position: absolute;
  font-size: 38px;
  opacity: .4;
}

.s1 { top: 70px; left: 10px; }
.s2 { top: 150px; right: 10px; }
.s3 { bottom: 100px; left: 10px; }
.s4 { bottom: 150px; right: 15px; }

/* メイン */
.content {
  position: relative;
  z-index: 2;
  padding: 65px 22px 25px;
  text-align: center;
}

h1 {
  margin: 0;
  color: #b71c1c;
  font-size: 30px;
}

.subtitle {
  margin: 7px 0 15px;
  color: #777;
  font-size: 13px;
}

/* おみくじ箱 */
.omikuji-box {
  position: relative;
  width: 180px;
  height: 180px;
  margin: 10px auto 20px;
  border-radius: 15px 15px 25px 25px;
  background: linear-gradient(90deg, #b71c1c, #d32f2f, #b71c1c);
  box-shadow: 0 10px 20px rgba(120,0,0,.25);
}

/* 金色の模様 */
.omikuji-box::before {
  content: "福";
  position: absolute;
  left: 50%;
  top: 55%;
  transform: translate(-50%, -50%);
  color: #ffd54f;
  font-size: 65px;
  font-weight: bold;
  opacity: .8;
}

/* 棒 */
.stick {
  position: absolute;
  z-index: 3;
  left: 50%;
  top: -85px;
  width: 14px;
  height: 125px;
  transform: translateX(-50%);
  transform-origin: bottom center;
  border-radius: 8px 8px 2px 2px;
  background: linear-gradient(90deg, #c58b45, #f5c26b, #a96f32);
  box-shadow: 2px 2px 5px rgba(0,0,0,.25);
  transition: transform .15s;
}

.stick::after {
  content: "一";
  position: absolute;
  top: 8px;
  left: 2px;
  color: #7b3f00;
  font-size: 11px;
  font-weight: bold;
}

/* 振るアニメーション */
.shaking .stick {
  animation: shake 0.12s infinite alternate;
}

@keyframes shake {
  from {
    transform: translateX(-50%) rotate(-18deg);
  }

  to {
    transform: translateX(-50%) rotate(18deg);
  }
}

/* 結果 */
.result {
  min-height: 90px;
  padding: 12px;
  border: 2px solid #d32f2f;
  border-radius: 15px;
  background: rgba(255,255,255,.9);
}

#fortune {
  color: #c62828;
  font-size: 38px;
  font-weight: bold;
}

#message {
  margin-top: 5px;
  color: #555;
  font-size: 12px;
  line-height: 1.5;
}

/* ボタン */
button {
  width: 100%;
  margin-top: 15px;
  padding: 15px;
  border: 0;
  border-radius: 50px;
  background: linear-gradient(135deg, #d32f2f, #a91515);
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 5px 12px rgba(160,0,0,.3);
}

button:active {
  transform: scale(.96);
}

button:disabled {
  opacity: .6;
  cursor: default;
}

/* 結果登場 */
.show-result {
  animation: resultPop .5s ease-out;
}

@keyframes resultPop {
  0% {
    transform: scale(.3) rotate(-10deg);
    opacity: 0;
  }

  70% {
    transform: scale(1.15) rotate(3deg);
    opacity: 1;
  }

  100% {
    transform: scale(1) rotate(0);
  }
}

/* ホームバー */
.home-bar {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 100px;
  height: 4px;
  border-radius: 10px;
  background: #333;
}
</style>
</head>

<body>

<div class="phone">

  <div class="notch"></div>

  <div class="screen">

    <div class="sakura s1">🌸</div>
    <div class="sakura s2">🌸</div>
    <div class="sakura s3">🌸</div>
    <div class="sakura s4">🌸</div>

    <div class="content">

      <h1>🎋 おみくじ 🎋</h1>

      <div class="subtitle">
        今日の運勢を占おう
      </div>

      <!-- おみくじ箱 -->
      <div class="omikuji-box" id="box">
        <div class="stick"></div>
      </div>

      <!-- 結果 -->
      <div class="result" id="resultBox">
        <div id="fortune">？？？</div>
        <div id="message">
          おみくじを引いてみよう！
        </div>
      </div>

      <button id="drawButton" onclick="drawOmikuji()">
        🎋 おみくじを引く！
      </button>

    </div>

    <div class="home-bar"></div>

  </div>
</div>


<script>

const fortunes = [
  {
    name: "大吉",
    message: "最高の運勢！✨<br>今日は何をしてもうまくいきそう！"
  },
  {
    name: "中吉",
    message: "いいことが起こりそう！🌸<br>笑顔を大切にしよう。"
  },
  {
    name: "小吉",
    message: "小さな幸せが見つかる日。<br>周りをよく見てみよう。"
  },
  {
    name: "吉",
    message: "落ち着いて行動すれば<br>良い結果につながりそう！"
  },
  {
    name: "末吉",
    message: "これから運気上昇！📈<br>焦らずゆっくり進もう。"
  },
  {
    name: "凶",
    message: "今日は慎重に行動しよう。<br>きっと明日は良い日になる！"
  }
];


function drawOmikuji() {

  const button = document.getElementById("drawButton");
  const box = document.getElementById("box");
  const resultBox = document.getElementById("resultBox");

  // ボタンを無効化
  button.disabled = true;
  button.textContent = "🎋 シャカシャカ…";

  // 結果を隠す
  document.getElementById("fortune").textContent = "？？？";
  document.getElementById("message").textContent =
    "運勢を占っています…";

  // 箱を振る
  box.classList.add("shaking");

  // 2秒後に結果
  setTimeout(() => {

    box.classList.remove("shaking");

    const random =
      Math.floor(Math.random() * fortunes.length);

    const fortune = fortunes[random];

    document.getElementById("fortune").textContent =
      fortune.name;

    document.getElementById("message").innerHTML =
      fortune.message;

    // 結果アニメーション
    resultBox.classList.remove("show-result");

    // 再アニメーション用
    void resultBox.offsetWidth;

    resultBox.classList.add("show-result");

    button.disabled = false;
    button.textContent = "🔄 もう一度引く！";

  }, 2000);
}

</script>

</body>
</html>
