<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>おみくじ＆恋みくじ</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #f7c5c5, #ffe5ac);
  font-family: "Yu Gothic", sans-serif;
}

/* スマホ */
.phone {
  position: relative;
  width: 340px;
  height: 680px;
  padding: 10px;
  background: #222;
  border: 7px solid #111;
  border-radius: 48px;
  box-shadow: 0 25px 50px rgba(0,0,0,.3);
}

.notch {
  position: absolute;
  z-index: 20;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: 105px;
  height: 25px;
  border-radius: 20px;
  background: #111;
}

.screen {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  border-radius: 35px;
  background: #fff8f5;
}

/* 桜 */
.sakura {
  position: absolute;
  font-size: 38px;
  opacity: .4;
}

.s1 { top: 70px; left: 10px; }
.s2 { top: 150px; right: 10px; }
.s3 { bottom: 100px; left: 10px; }
.s4 { bottom: 150px; right: 15px; }

/* メイン */
.content {
  position: relative;
  z-index: 2;
  padding: 65px 22px 25px;
  text-align: center;
}

h1 {
  margin: 0;
  color: #b71c1c;
  font-size: 29px;
}

.subtitle {
  margin: 6px 0 12px;
  color: #777;
  font-size: 13px;
}

/* モード切り替え */
.mode-buttons {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}

.mode-buttons button {
  margin: 0;
  padding: 9px 5px;
  font-size: 12px;
  background: #eee;
  color: #777;
  box-shadow: none;
}

.mode-buttons button.active {
  background: #d32f2f;
  color: white;
}

.mode-buttons button.love.active {
  background: #e91e63;
}

/* おみくじエリア */
.omikuji-area {
  position: relative;
  width: 190px;
  height: 195px;
  margin: 0 auto 5px;
}

/* 箱 */
.omikuji-box {
  position: absolute;
  left: 5px;
  bottom: 0;
  width: 180px;
  height: 145px;
  border-radius: 15px 15px 25px 25px;
  background: linear-gradient(
    90deg,
    #9e1515,
    #d32f2f,
    #ef5350,
    #b71c1c
  );
  box-shadow: 0 10px 20px rgba(120,0,0,.3);
}

.love-mode .omikuji-box {
  background: linear-gradient(
    90deg,
    #c2185b,
    #e91e63,
    #f06292,
    #ad1457
  );
}

.omikuji-box::before {
  content: "福";
  position: absolute;
  left: 50%;
  top: 58%;
  transform: translate(-50%, -50%);
  color: #ffd54f;
  font-size: 65px;
  font-weight: bold;
}

.love-mode .omikuji-box::before {
  content: "恋";
}

/* 箱の口 */
.box-top {
  position: absolute;
  z-index: 4;
  left: 20px;
  top: -5px;
  width: 140px;
  height: 18px;
  border-radius: 50%;
  background: #761010;
  border: 3px solid #5d0b0b;
}

.love-mode .box-top {
  background: #880e4f;
  border-color: #6a073d;
}

/* 棒 */
.stick {
  position: absolute;
  z-index: 3;
  left: 50%;
  top: -95px;
  width: 13px;
  height: 130px;
  transform: translateX(-50%);
  transform-origin: bottom center;
  border-radius: 8px 8px 2px 2px;
  background: linear-gradient(
    90deg,
    #a96f32,
    #f5c26b,
    #c58b45
  );
}

/* シャカシャカ */
.shaking .stick {
  animation: shake .11s infinite alternate;
}

.shaking .omikuji-box {
  animation: boxShake .11s infinite alternate;
}

@keyframes shake {
  from {
    transform: translateX(-50%) rotate(-18deg);
  }
  to {
    transform: translateX(-50%) rotate(18deg);
  }
}

@keyframes boxShake {
  from {
    transform: translateX(-5px) rotate(-2deg);
  }
  to {
    transform: translateX(5px) rotate(2deg);
  }
}

/* 紙 */
.paper {
  position: absolute;
  z-index: 2;
  left: 50%;
  bottom: 60px;
  width: 115px;
  height: 145px;
  padding: 10px;
  transform: translateX(-50%) translateY(100px);
  background: #fffbe9;
  border: 2px solid #d8b96a;
  box-shadow: 0 5px 12px rgba(0,0,0,.2);
  opacity: 0;
}

.love-mode .paper {
  background: #fff0f5;
  border-color: #e57399;
}

.paper::before {
  content: "御神籤";
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  color: #a67c00;
  font-size: 12px;
  writing-mode: vertical-rl;
}

.love-mode .paper::before {
  content: "恋みくじ";
  color: #c2185b;
}

#paperResult {
  position: absolute;
  top: 45px;
  left: 0;
  width: 100%;
  color: #b71c1c;
  font-size: 25px;
  font-weight: bold;
  text-align: center;
}

.love-mode #paperResult {
  color: #e91e63;
}

.paper.show {
  animation: paperOut 1.2s cubic-bezier(.2,.9,.25,1.2) forwards;
}

@keyframes paperOut {
  0% {
    transform: translateX(-50%) translateY(100px);
    opacity: 0;
  }

  30% {
    opacity: 1;
  }

  70% {
    transform: translateX(-50%) translateY(-45px) rotate(-4deg);
  }

  100% {
    transform: translateX(-50%) translateY(-30px);
    opacity: 1;
  }
}

/* 結果 */
.result {
  min-height: 72px;
  padding: 8px;
  border: 2px solid #d32f2f;
  border-radius: 15px;
  background: rgba(255,255,255,.94);
}

.love-mode .result {
  border-color: #e91e63;
}

#fortune {
  color: #c62828;
  font-size: 31px;
  font-weight: bold;
}

.love-mode #fortune {
  color: #e91e63;
}

#message {
  margin-top: 3px;
  color: #555;
  font-size: 11px;
  line-height: 1.4;
}

/* 引くボタン */
#drawButton {
  width: 100%;
  margin-top: 10px;
  padding: 13px;
  border: 0;
  border-radius: 50px;
  background: linear-gradient(135deg,#d32f2f,#a91515);
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 5px 12px rgba(160,0,0,.3);
}

.love-mode #drawButton {
  background: linear-gradient(135deg,#ec407a,#c2185b);
}

#drawButton:active {
  transform: scale(.96);
}

#drawButton:disabled {
  opacity: .6;
}

/* ホームバー */
.home-bar {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 100px;
  height: 4px;
  border-radius: 10px;
  background: #333;
}
</style>
</head>

<body>

<div class="phone">

  <div class="notch"></div>

  <div class="screen" id="screen">

    <div class="sakura s1">🌸</div>
    <div class="sakura s2">🌸</div>
    <div class="sakura s3">🌸</div>
    <div class="sakura s4">🌸</div>

    <div class="content">

      <h1 id="title">🎋 おみくじ 🎋</h1>

      <div class="subtitle" id="subtitle">
        今日の運勢を占おう
      </div>

      <!-- 切り替え -->
      <div class="mode-buttons">

        <button
          id="normalButton"
          class="active"
          onclick="changeMode('normal')">
          🎋 おみくじ
        </button>

        <button
          id="loveButton"
          class="love"
          onclick="changeMode('love')">
          💕 恋みくじ
        </button>

      </div>

      <!-- おみくじ -->
      <div class="omikuji-area" id="area">

        <div class="paper" id="paper">
          <div id="paperResult">？？？</div>
        </div>

        <div class="omikuji-box" id="box">

          <div class="box-top"></div>

          <div class="stick"></div>

        </div>

      </div>

      <!-- 結果 -->
      <div class="result">

        <div id="fortune">？？？</div>

        <div id="message">
          おみくじを引いてみよう！
        </div>

      </div>

      <button id="drawButton" onclick="drawOmikuji()">
        🎋 おみくじを引く！
      </button>

    </div>

    <div class="home-bar"></div>

  </div>
</div>


<script>

let currentMode = "normal";


/* 通常おみくじ */
const normalFortunes = [
  {
    name: "大吉",
    message: "最高の運勢！✨<br>今日は何をしてもうまくいきそう！"
  },
  {
    name: "中吉",
    message: "いいことが起こりそう！🌸<br>笑顔を大切にしよう。"
  },
  {
    name: "小吉",
    message: "小さな幸せが見つかる日。<br>周りをよく見てみよう。"
  },
  {
    name: "吉",
    message: "落ち着いて行動すれば<br>良い結果につながりそう！"
  },
  {
    name: "末吉",
    message: "これから運気上昇！📈<br>焦らずゆっくり進もう。"
  },
  {
    name: "凶",
    message: "今日は慎重に行動しよう。<br>きっと明日は良い日になる！"
  }
];


/* 恋みくじ */
const loveFortunes = [
  {
    name: "💖 大恋愛",
    message: "運命の恋が動き出す予感！<br>勇気を出して一歩踏み出そう。"
  },
  {
    name: "💕 両思い",
    message: "二人の心はかなり近いかも。<br>素直な気持ちを伝えてみて。"
  },
  {
    name: "💘 恋愛成就",
    message: "あなたの恋が実るチャンス！<br>笑顔が最高のお守り。"
  },
  {
    name: "🌸 片思い吉",
    message: "焦らず少しずつ距離を縮めよう。<br>自然な会話が恋のきっかけに。"
  },
  {
    name: "💌 連絡吉",
    message: "今日は連絡運が好調！<br>気になる人にメッセージしてみよう。"
  },
  {
    name: "💗 恋の予感",
    message: "思いがけない出会いがありそう。<br>いつもより少しおしゃれして出かけよう！"
  },
  {
    name: "💔 恋愛注意",
    message: "今日は焦らないことが大切。<br>相手の気持ちをゆっくり考えてみよう。"
  }
];


/* モード変更 */
function changeMode(mode) {

  currentMode = mode;

  const screen = document.getElementById("screen");

  const normalButton =
    document.getElementById("normalButton");

  const loveButton =
    document.getElementById("loveButton");

  const title =
    document.getElementById("title");

  const subtitle =
    document.getElementById("subtitle");

  const drawButton =
    document.getElementById("drawButton");

  screen.classList.remove("love-mode");

  normalButton.classList.remove("active");
  loveButton.classList.remove("active");

  if (mode === "love") {

    screen.classList.add("love-mode");
    loveButton.classList.add("active");

    title.textContent = "💕 恋みくじ 💕";
    subtitle.textContent = "あなたの恋の運勢は？";

    drawButton.textContent =
      "💕 恋みくじを引く！";

  } else {

    normalButton.classList.add("active");

    title.textContent = "🎋 おみくじ 🎋";
    subtitle.textContent = "今日の運勢を占おう";

    drawButton.textContent =
      "🎋 おみくじを引く！";
  }

  document.getElementById("fortune").textContent = "？？？";
  document.getElementById("message").textContent =
    mode === "love"
      ? "恋みくじを引いてみよう！💕"
      : "おみくじを引いてみよう！";

  document.getElementById("paper").classList.remove("show");
}


/* おみくじを引く */
function drawOmikuji() {

  const button =
    document.getElementById("drawButton");

  const box =
    document.getElementById("box");

  const paper =
    document.getElementById("paper");

  const fortuneText =
    document.getElementById("fortune");

  const message =
    document.getElementById("message");

  button.disabled = true;

  button.textContent =
    currentMode === "love"
      ? "💕 ドキドキ…"
      : "🎋 シャカシャカ…";

  paper.classList.remove("show");

  fortuneText.textContent = "？？？";

  message.textContent =
    currentMode === "love"
      ? "恋の運勢を占っています…"
      : "運勢を占っています…";

  /* シャカシャカ */
  box.classList.add("shaking");


  /* 2秒後 */
  setTimeout(() => {

    box.classList.remove("shaking");

    const list =
      currentMode === "love"
        ? loveFortunes
        : normalFortunes;

    const random =
      Math.floor(Math.random() * list.length);

    const fortune = list[random];

    /* 紙に結果 */
    document.getElementById("paperResult")
      .textContent = fortune.name;

    /* 紙が飛び出す */
    paper.classList.add("show");


    /* 少し遅れて下にも表示 */
    setTimeout(() => {

      fortuneText.innerHTML =
        fortune.name;

      message.innerHTML =
        fortune.message;

      button.disabled = false;

      button.textContent =
        currentMode === "love"
          ? "💕 もう一度恋みくじ！"
          : "🔄 もう一度引く！";

    }, 700);

  }, 2000);
}

</script>

</body>
</html>
