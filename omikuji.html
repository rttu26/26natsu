  ];

}

}

else {

fortune = list[index];

}

cards[index]
.classList.add("selected");

cards.forEach((card, i) => {

if (i !== index) {

  card.classList.add("disabled");

}

});

cards[index]
.querySelector(".card-result")
.textContent =
fortune[0];

cards[index]
.querySelector(".card-detail")
.textContent =
fortune[1];

setTimeout(() => {

showBigResult(fortune);

}, 700);

}

fortune[0];

リセット
========================= */

function resetCards() {

selected = false;

document
.querySelectorAll(".card")
.forEach(card => {

  card.classList.remove(
    "selected",
    "disabled"
  );

  card.querySelector(

  ).textContent = "";

  card.querySelector(
    ".card-detail"
  ).textContent = "";

});

document.getElementById(
"fortune"
).textContent =
"？？？";

document.getElementById(
"message"
).textContent =

currentMode === "love"
  ? "カードを1枚選んでください 💕"

  : currentMode === "dark"
  ? "闇に触れるカードを1枚選んでください ☠"

  : "カードを1枚選んでください ✨";

}

/* =========================
キラキラ
========================= */

function createSparkles() {

const screen =
document.getElementById(
"screen"
);

let symbols;

if (currentMode === "love") {

symbols = [
  "💕",
  "💗",
  "✨",
  "💖",
  "💘"
];

}

else if (currentMode === "dark") {

symbols = [
  "☠",
  "🩸",
  "⚫",
  "🔻"
];

}

else {

symbols = [
  "✨",
  "🌸",
  "🎋",
  "⭐"
];

}

for (
let i = 0;
i < 14;
i++
) {

const sparkle =
  document.createElement(
    "div"
  );

sparkle.className =
  "sparkle";

sparkle.textContent =
  symbols[
    Math.floor(
      Math.random() *
      symbols.length
    )
  ];

sparkle.style.left =
  (10 +
   Math.random() * 80)
  + "%";

sparkle.style.top =
  (15 +
   Math.random() * 70)
  + "%";

sparkle.style.animationDelay =
  (Math.random() * .5)
  + "s";

screen.appendChild(
  sparkle
);

setTimeout(
  () => sparkle.remove(),
  1600
);

}

}

/* =========================
製作者パスコード
========================= */

const creatorPassword = "0831";

let enteredPassword = "";

/* 製作者ボタン */

function openLock() {

enteredPassword = "";

updateDots();

document
.getElementById("lockError")
.classList.remove("show");

document
.getElementById("lockScreen")
.classList.add("show");

}

/* キーパッド */

function pressKey(number) {

if (
enteredPassword.length >=
creatorPassword.length
) {
return;
}

enteredPassword += number;

updateDots();

/*
必要な文字数まで入力されたら
自動的にチェック
*/

if (
enteredPassword.length ===
creatorPassword.length
) {

setTimeout(
  checkPassword,
  180
);

}

}

/* 削除 */

function deleteKey() {

enteredPassword =
enteredPassword.slice(0, -1);

updateDots();

}

/* ●表示 */

function updateDots() {

const dots =
document.querySelectorAll(
".pass-dot"
);

dots.forEach(
(dot, index) => {

  dot.classList.toggle(
    "filled",
    index <
    enteredPassword.length
  );

}

);

}

/* パスワード確認 */

function checkPassword() {

if (
enteredPassword ===
creatorPassword
) {

unlockDarkFortune();

}

else {

const error =
  document.getElementById(
    "lockError"
  );

error.classList.remove(
  "show"
);

void error.offsetWidth;

error.classList.add(
  "show"
);

enteredPassword = "";

setTimeout(
  updateDots,
  150
);

}

}

/* 闇みくじ解放 */

function unlockDarkFortune() {

document
.getElementById("lockScreen")
.classList.remove("show");

document
.getElementById("darkButton")
.style.display =
"block";

changeMode("dark");

}

/* パスコード画面を閉じる */

function closeLock() {

document
.getElementById("lockScreen")
.classList.remove("show");

}
