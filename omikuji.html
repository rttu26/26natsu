<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>おみくじ＆恋みくじ</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;

  display: flex;
  justify-content: center;
  align-items: center;

  position: relative;

  background:
    radial-gradient(
      circle at 20% 20%,
      #ffd6d6 0 4%,
      transparent 5%
    ),
    radial-gradient(
      circle at 80% 70%,
      #ffe7b3 0 5%,
      transparent 6%
    ),
    linear-gradient(
      135deg,
      #f6c5c5,
      #ffe6ad
    );

  font-family:
    "Yu Gothic",
    "Hiragino Kaku Gothic ProN",
    sans-serif;

  overflow-x: hidden;
}


/* ========================================
   スマホ本体
======================================== */

.phone {
  position: relative;
  z-index: 5;

  width: 350px;
  height: 700px;

  padding: 10px;

  background: #222;

  border: 7px solid #111;

  border-radius: 50px;

  box-shadow:
    0 25px 55px rgba(0,0,0,.3);
}


/* ========================================
   周辺の闇みくじボタン
======================================== */

.dark-area {
  position: absolute;

  z-index: 20;

  left: 50%;

  top: calc(50% + 365px);

  transform: translateX(-50%);

  display: flex;
  flex-direction: column;
  align-items: center;

  gap: 5px;
}


/* 小さな説明 */

.dark-area-text {
  color: #7b2020;

  font-size: 11px;

  font-weight: bold;

  letter-spacing: 2px;

  text-shadow:
    0 1px 0 white;

  opacity: .9;
}


/* 闇ボタン */

.dark-area button {

  position: relative;

  min-width: 190px;

  padding: 13px 28px;

  border: 2px solid #700000;

  border-radius: 50px;

  background:
    linear-gradient(
      135deg,
      #242424,
      #080808
    );

  color: #ff3030;

  font-size: 16px;

  font-weight: bold;

  letter-spacing: 1px;

  cursor: pointer;

  box-shadow:
    0 7px 18px rgba(0,0,0,.35),
    0 0 15px rgba(130,0,0,.35);

  transition:
    transform .2s,
    box-shadow .2s;
}


/* 赤い光 */

.dark-area button::before {

  content: "";

  position: absolute;

  inset: 3px;

  border-radius: 50px;

  border: 1px solid
    rgba(255,60,60,.25);

  pointer-events: none;
}


.dark-area button:hover {

  transform:
    translateY(-4px)
    scale(1.04);

  box-shadow:
    0 10px 25px rgba(0,0,0,.45),
    0 0 25px rgba(180,0,0,.5);

}


.dark-area button:active {

  transform:
    translateY(1px)
    scale(.97);

}


/* ========================================
   ノッチ
======================================== */

.notch {

  position: absolute;

  z-index: 300;

  top: 10px;
  left: 50%;

  transform:
    translateX(-50%);

  width: 105px;
  height: 25px;

  border-radius: 20px;

  background: #111;
}


/* ========================================
   スクリーン
======================================== */

.screen {

  position: relative;

  width: 100%;
  height: 100%;

  overflow: hidden;

  border-radius: 37px;

  background:
    linear-gradient(
      rgba(255,255,255,.75),
      rgba(255,248,245,.9)
    ),
    #fff0f0;
}


/* ========================================
   コンテンツ
======================================== */

.content {

  position: relative;

  z-index: 2;

  padding:
    55px
    13px
    25px;

  text-align: center;
}


h1 {

  margin: 0;

  color: #b71c1c;

  font-size: 28px;
}


.subtitle {

  margin:
    5px
    0
    12px;

  color: #777;

  font-size: 12px;
}


/* ========================================
   桜
======================================== */

.sakura {

  position: absolute;

  font-size: 35px;

  opacity: .35;
}


.s1 {
  top: 65px;
  left: 10px;
}


.s2 {
  top: 135px;
  right: 10px;
}


.s3 {
  bottom: 90px;
  left: 12px;
}


.s4 {
  bottom: 145px;
  right: 12px;
}


/* ========================================
   モードボタン
======================================== */

.mode-buttons {

  display: flex;

  gap: 7px;

  margin-bottom: 13px;
}


.mode-buttons button {

  flex: 1;

  padding:
    8px
    3px;

  border: 0;

  border-radius: 30px;

  background: #eee;

  color: #777;

  font-size: 11px;

  cursor: pointer;
}


.mode-buttons button.active {

  background: #c62828;

  color: white;
}


.mode-buttons button.love.active {

  background: #e91e63;
}


.mode-buttons button.dark.active {

  background: #171717;

  color: #ff5252;
}


/*
   闇ボタンはスマホ内には
   表示しない
*/

#darkButton {
  display: none !important;
}


/* ========================================
   16枚カード
======================================== */

.cards {

  width: 100%;

  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 6px;

  perspective: 1000px;
}


.card {

  height: 88px;

  position: relative;

  cursor: pointer;

  perspective: 800px;

  transition:
    transform .2s;
}


.card:hover {

  transform:
    translateY(-4px);
}


.card-inner {

  position: relative;

  width: 100%;
  height: 100%;

  transition:
    transform
    .75s
    cubic-bezier(.2,.7,.2,1);

  transform-style:
    preserve-3d;
}


.card.selected
.card-inner {

  transform:
    rotateY(180deg);
}


.card-front,
.card-back {

  position: absolute;

  width: 100%;
  height: 100%;

  backface-visibility:
    hidden;

  border-radius: 10px;

  overflow: hidden;
}


/* ========================================
   カード裏
======================================== */

.card-back {

  display: flex;

  justify-content: center;

  align-items: center;

  background:
    repeating-linear-gradient(
      45deg,
      transparent,
      transparent 5px,
      rgba(255,255,255,.12) 6px,
      transparent 7px
    ),
    #b71c1c;

  border:
    2px solid #f4c76b;

  box-shadow:
    0 4px 8px
    rgba(0,0,0,.2);
}


.card-back::before {

  content: "🎋";

  font-size: 25px;
}


.love-mode .card-back {

  background:
    repeating-linear-gradient(
      45deg,
      transparent,
      transparent 5px,
      rgba(255,255,255,.12) 6px,
      transparent 7px
    ),
    #c2185b;

  border-color:
    #ffd1df;
}


.love-mode
.card-back::before {

  content: "💗";
}


.dark-mode .card-back {

  background:
    repeating-linear-gradient(
      45deg,
      transparent,
      transparent 5px,
      rgba(255,0,0,.08) 6px,
      transparent 7px
    ),
    #090909;

  border-color:
    #8b0000;
}


.dark-mode
.card-back::before {

  content: "☠";

  color: #d40000;

  font-size: 27px;
}


/* ========================================
   カード表
======================================== */

.card-front {

  transform:
    rotateY(180deg);

  display: flex;

  flex-direction: column;

  justify-content: center;

  align-items: center;

  padding: 3px;

  background:
    linear-gradient(
      135deg,
      #fffdf2,
      #fff5d8
    );

  border:
    2px solid #d4aa48;

  box-shadow:
    0 4px 10px
    rgba(0,0,0,.2);
}


.card-front::before {

  content: "御神籤";

  color: #9b751b;

  font-size: 7px;

  margin-bottom: 3px;
}


.love-mode .card-front {

  background:
    linear-gradient(
      135deg,
      #fff8fb,
      #ffe3ed
    );

  border-color:
    #e57399;
}


.love-mode
.card-front::before {

  content: "恋みくじ";

  color: #c2185b;
}


.dark-mode .card-front {

  background:
    linear-gradient(
      135deg,
      #181818,
      #050505
    );

  border-color:
    #8b0000;
}


.dark-mode
.card-front::before {

  content: "闇みくじ";

  color: #e00000;
}


.card-result {

  color: #b71c1c;

  font-size: 12px;

  font-weight: bold;

  text-align: center;
}


.love-mode
.card-result {

  color: #e91e63;
}


.dark-mode
.card-result {

  color: #ff3030;
}


.card-detail {

  margin-top: 3px;

  color: #666;

  font-size: 6px;

  line-height: 1.2;

  text-align: center;
}


.dark-mode
.card-detail {

  color: #bbb;
}


.card.disabled {

  pointer-events: none;

  opacity: .22;
}


.card.selected {

  transform:
    translateY(-6px);
}


.card.selected
.card-front {

  box-shadow:
    0 0 0 3px #ffd54f,
    0 8px 20px
    rgba(255,80,80,.35);
}


/* ========================================
   結果欄
======================================== */

.result-box {

  min-height: 65px;

  margin-top: 10px;

  padding: 7px;

  border:
    2px solid #c62828;

  border-radius: 15px;

  background:
    rgba(255,255,255,.94);
}


.love-mode
.result-box {

  border-color:
    #e91e63;
}


.dark-mode
.result-box {

  border-color:
    #8b0000;

  background:
    rgba(20,20,20,.95);
}


#fortune {

  color: #c62828;

  font-size: 24px;

  font-weight: bold;
}


.love-mode #fortune {

  color: #e91e63;
}


.dark-mode #fortune {

  color: #ff3030;
}


#message {

  margin-top: 3px;

  color: #555;

  font-size: 9px;

  line-height: 1.4;
}


.dark-mode #message {

  color: #bbb;
}


/* ========================================
   もう一度
======================================== */

#resetButton {

  width: 100%;

  margin-top: 8px;

  padding: 10px;

  border: 0;

  border-radius: 50px;

  background:
    linear-gradient(
      135deg,
      #d32f2f,
      #a91515
    );

  color: white;

  font-size: 14px;

  font-weight: bold;

  cursor: pointer;
}


.love-mode
#resetButton {

  background:
    linear-gradient(
      135deg,
      #ec407a,
      #c2185b
    );
}


.dark-mode
#resetButton {

  background:
    linear-gradient(
      135deg,
      #333,
      #080808
    );

  color: #ff3030;
}


/* ========================================
   全画面結果
======================================== */

.result-screen {

  position: absolute;

  z-index: 100;

  inset: 0;

  display: flex;

  flex-direction: column;

  justify-content: center;

  align-items: center;

  padding: 30px;

  text-align: center;

  background:
    radial-gradient(
      circle at center,
      #fff,
      #ffe8ef 45%,
      #f8b6c9
    );

  transform: scale(0);

  opacity: 0;

  pointer-events: none;
}


.result-screen.show {

  animation:
    resultBang
    .65s
    cubic-bezier(.15,1.5,.3,1)
    forwards;

  pointer-events: auto;
}


@keyframes resultBang {

  0% {

    transform: scale(0);

    opacity: 0;

  }

  55% {

    transform: scale(1.08);

    opacity: 1;

  }

  75% {

    transform: scale(.97);

  }

  100% {

    transform: scale(1);

    opacity: 1;

  }

}


.normal-result {

  background:
    radial-gradient(
      circle at center,
      #fff,
      #fff5d0 45%,
      #f2d27a
    );
}


.dark-result {

  background:
    radial-gradient(
      circle at center,
      #250000,
      #090909 55%,
      #000
    );

  color: white;
}


.result-icon {

  font-size: 65px;

  margin-bottom: 10px;

  animation:
    iconPop
    .7s
    .2s
    both;
}


@keyframes iconPop {

  0% {

    transform:
      scale(0)
      rotate(-20deg);

  }

  70% {

    transform:
      scale(1.2)
      rotate(10deg);

  }

  100% {

    transform:
      scale(1)
      rotate(0);

  }

}


.result-title {

  color: #e91e63;

  font-size: 45px;

  font-weight: bold;

  text-shadow:
    2px 2px 0 white,
    0 0 15px
    rgba(233,30,99,.3);

  animation:
    titlePop
    .7s
    .1s
    both;
}


.normal-result
.result-title {

  color: #c62828;
}


.dark-result
.result-title {

  color: #ff3030;

  text-shadow:
    0 0 20px #900;
}


@keyframes titlePop {

  0% {

    transform:
      scale(2);

    opacity: 0;

  }

  100% {

    transform:
      scale(1);

    opacity: 1;

  }

}


.result-line {

  width: 150px;

  height: 2px;

  margin: 15px 0;

  background: #e57399;
}


.normal-result
.result-line {

  background:
    #d4aa48;
}


.dark-result
.result-line {

  background:
    #900;
}


.result-message {

  max-width: 260px;

  color: #555;

  font-size: 16px;

  line-height: 1.8;
}


.dark-result
.result-message {

  color: #ddd;
}


.result-screen button {

  width: 200px;

  margin-top: 30px;

  padding: 13px;

  border: 0;

  border-radius: 50px;

  background:
    #e91e63;

  color: white;

  font-size: 15px;

  font-weight: bold;

  cursor: pointer;
}


.normal-result
.result-screen button {

  background:
    #c62828;
}


.dark-result
.result-screen button {

  background:
    #8b0000;
}


/* ========================================
   キラキラ
======================================== */

.sparkle {

  position: absolute;

  z-index: 150;

  pointer-events: none;

  font-size: 24px;

  animation:
    sparkle
    1s
    ease-out
    forwards;
}


@keyframes sparkle {

  0% {

    transform:
      scale(.2);

    opacity: 0;

  }

  30% {

    opacity: 1;

  }

  100% {

    transform:
      translateY(-45px)
      scale(1.4);

    opacity: 0;

  }

}


/* ========================================
   ホームバー
======================================== */

.home-bar {

  position: absolute;

  bottom: 8px;

  left: 50%;

  transform:
    translateX(-50%);

  width: 100px;

  height: 4px;

  border-radius: 10px;

  background: #333;
}


/* ========================================
   パスコード画面
======================================== */

.lock-screen {

  position: absolute;

  z-index: 500;

  inset: 0;

  display: flex;

  flex-direction: column;

  align-items: center;

  padding-top: 80px;

  background:
    linear-gradient(
      rgba(15,15,20,.96),
      rgba(5,5,10,.99)
    );

  color: white;

  opacity: 0;

  pointer-events: none;

  transition:
    opacity .25s;
}


.lock-screen.show {

  opacity: 1;

  pointer-events: auto;
}


.lock-title {

  font-size: 16px;

  margin-bottom: 8px;
}


.lock-subtitle {

  color: #aaa;

  font-size: 10px;

  margin-bottom: 20px;
}


.pass-dots {

  display: flex;

  gap: 12px;

  height: 18px;

  margin-bottom: 25px;
}


.pass-dot {

  width: 10px;

  height: 10px;

  border-radius: 50%;

  border:
    1px solid #aaa;
}


.pass-dot.filled {

  background:
    white;
}


.keypad {

  display: grid;

  grid-template-columns:
    repeat(3, 65px);

  gap: 13px;
}


.key {

  width: 65px;

  height: 65px;

  border: 0;

  border-radius: 50%;

  background:
    rgba(255,255,255,.13);

  color: white;

  font-size: 22px;

  cursor: pointer;
}


.key:active {

  background:
    rgba(255,255,255,.35);

  transform:
    scale(.94);
}


.key.empty {

  background:
    transparent;

  cursor:
    default;
}


.lock-cancel {

  margin-top: 18px;

  border: 0;

  background:
    transparent;

  color: #aaa;

  font-size: 11px;

  cursor: pointer;
}


.lock-error {

  position: absolute;

  top: 410px;

  color: #ff5252;

  font-size: 10px;

  opacity: 0;
}


.lock-error.show {

  animation:
    errorShake
    .35s;

  opacity: 1;
}


@keyframes errorShake {

  0%,100% {

    transform:
      translateX(0);

  }

  25% {

    transform:
      translateX(-8px);

  }

  75% {

    transform:
      translateX(8px);

  }

}


/* ========================================
   24時間ロック
======================================== */

.locked-message {

  display: none;

  position: absolute;

  z-index: 510;

  inset: 0;

  align-items: center;

  justify-content: center;

  flex-direction: column;

  text-align: center;

  background:
    rgba(5,5,8,.98);

  color: white;

  padding: 30px;
}


.locked-message.show {

  display: flex;
}


.locked-icon {

  font-size: 50px;

  margin-bottom: 15px;
}


.locked-title {

  color: #ff4444;

  font-size: 18px;

  font-weight: bold;
}


.locked-text {

  margin-top: 10px;

  color: #aaa;

  font-size: 11px;

  line-height: 1.8;
}


/* ========================================
   スマホ表示時
======================================== */

@media (max-width: 500px) {

  body {

    align-items: center;

    padding-bottom: 85px;

  }


  .dark-area {

    top: auto;

    bottom: 12px;

  }


  .dark-area-text {

    font-size: 9px;

  }


  .dark-area button {

    min-width: 175px;

    padding: 11px 24px;

    font-size: 14px;

  }

}


/* ========================================
   PCの広い画面
======================================== */

@media (min-width: 501px) {

  .dark-area {

    /*
       スマホの下ではなく、
       スマホの右側に配置
    */

    top: 50%;

    left:
      calc(50% + 280px);

    transform:
      translateY(-50%);

  }

}


/* ========================================
   おみくじデータ
======================================== */

</style>
</head>


<body>


<!-- =====================================
     スマホ
===================================== -->

<div class="phone">

  <div class="notch"></div>

  <div
    class="screen"
    id="screen"
  >

    <div class="sakura s1">
      🌸
    </div>

    <div class="sakura s2">
      🌸
    </div>

    <div class="sakura s3">
      🌸
    </div>

    <div class="sakura s4">
      🌸
    </div>


    <div class="content">


      <h1 id="title">
        🎋 おみくじ 🎋
      </h1>


      <div class="subtitle">
        16枚の中から1枚選んでね
      </div>


      <!-- モード -->

      <div class="mode-buttons">

        <button
          id="normalButton"
          class="active"
          onclick="changeMode('normal')"
        >
          🎋 おみくじ
        </button>


        <button

          onclick="changeMode('love')"

      <!-- =================================

      <div class="cards">

            <div class="card-back"></div>

            <div class="card-front">

              <div class="card-result"></div>

              <div class="card-detail"></div>

            </div>

          </div>

        </div>


        <!-- 3 -->

        <div
          class="card"
          onclick="selectCard(event)"
        >

          <div class="card-inner">

            <div class="card-back"></div>

            <div class="card-front">

              <div class="card-result"></div>

              <div class="card-detail"></div>

            </div>

          </div>

        </div>


        <!-- 4 -->

        <div
          class="card"
          onclick="selectCard(event)"
        >

          <div class="card-inner">

            <div class="card-back"></div>

            <div class="card-front">

              <div class="card-result"></div>

              <div class="card-detail"></div>

            </div>

          </div>

        </div>


        <!-- 5 -->

        <div
          class="card"
          onclick="selectCard(event)"
        >

          <div class="card-inner">

            <div class="card-back"></div>

            <div class="card-front">

              <div class="card-result"></div>

              <div class="card-detail"></div>

            </div>

          </div>

        </div>


        <!-- 6 -->

        <div
          class="card"
          onclick="selectCard(event)"
        >

          <div class="card-inner">

            <div class="card-back"></div>

            <div class="card-front">

              <div class="card-result"></div>

              <div class="card-detail"></div>

            </div>

          </div>

        </div>


        <!-- 7 -->

        <div
          class="card"
          onclick="selectCard(event)"
        >

          <div class="card-inner">

            <div class="card-back"></div>

            <div class="card-front">

              <div class="card-result"></div>

              <div class="card-detail"></div>

            </div>

          </div>

        </div>


        <!-- 8 -->

        <div
          class="card"
          onclick="selectCard(event)"
        >

<script>


/* ========================================

  },

    weight: 20
  }

];


const loveFortunes = [

  ],

  [

];


const darkFortunes = [

  [

  [

  ]

];


let currentMode =
  "normal";

let selected =
  false;


/* ========================================
   パスコード
======================================== */

const creatorPassword =
  "0831";

let enteredPassword =
  "";

const MAX_MISTAKES =
  4;

const LOCK_TIME =
  24 * 60 * 60 * 1000;


let wrongCount =
  Number(
    localStorage.getItem(
      "omikujiWrongCount"
    )
  ) || 0;


let lockUntil =
  Number(
    localStorage.getItem(
      "omikujiLockUntil"
    )
  ) || 0;


/* ========================================
   通常おみくじ抽選
======================================== */

function getNormalFortune() {

  const totalWeight =
    normalFortunes.reduce(
      (
        sum,
        fortune
      ) =>
        sum +
        fortune.weight,
      0
    );


  let random =
    Math.random() *
    totalWeight;


  for (
    const fortune
    of normalFortunes
  ) {

    random -=
      fortune.weight;


    if (
      random < 0
    ) {

      return [
        fortune.result,
        fortune.message
      ];

    }

  }


  return [
    "末吉",
    "これから運気が上がっていく予感。"
  ];

}


/* ========================================
   シャッフル
======================================== */

function shuffleCards() {

  const cardsContainer =
    document.querySelector(
      ".cards"
    );


  const cards =
    Array.from(
      cardsContainer.querySelectorAll(
        ".card"
      )
    );


  for (
    let i =
      cards.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      cards[i],
      cards[j]
    ] =
    [
      cards[j],
      cards[i]
    ];

  }


  cards.forEach(
    card => {

      cardsContainer.appendChild(
        card
      );

    }
  );

}


/* ========================================
   モード変更
======================================== */

function changeMode(
  mode
) {

  currentMode =
    mode;


  const screen =
    document.getElementById(
      "screen"
    );


  document
    .getElementById(
      "normalButton"
    )
    .classList.remove(
      "active"
    );


  document
    .getElementById(
      "loveButton"
    )
    .classList.remove(
      "active"
    );


  document
    .getElementById(
      "darkButton"
    )
    .classList.remove(
      "active"
    );


  screen.classList.remove(
    "love-mode",
    "dark-mode"
  );


  if (
    mode === "love"
  ) {

    screen.classList.add(
      "love-mode"
    );


    document
      .getElementById(
        "loveButton"
      )
      .classList.add(
        "active"
      );


    document.getElementById(
      "title"
    ).textContent =
      "💕 恋みくじ 💕";

  }

  else if (
    mode === "dark"
  ) {

    screen.classList.add(
      "dark-mode"
    );


    document
      .getElementById(
        "darkButton"
      )
      .classList.add(
        "active"
      );


    document.getElementById(
      "title"
    ).textContent =
      "☠ 闇みくじ ☠";

  }

  else {

    document
      .getElementById(
        "normalButton"
      )
      .classList.add(
        "active"
      );


    document.getElementById(
      "title"
    ).textContent =
      "🎋 おみくじ 🎋";

  }


  resetCards();

}


/* ========================================
   スペースキー
======================================== */

let spacePressed =
  false;


document.addEventListener(
  "keydown",
  event => {

    if (
      event.code ===
      "Space"
    ) {

      spacePressed =
        true;

      event.preventDefault();

    }

  }
);


document.addEventListener(
  "keyup",
  event => {

    if (
      event.code ===
      "Space"
    ) {

      spacePressed =
        false;

    }

  }
);


/* ========================================
   カード選択
======================================== */

function selectCard(
  event
) {

  if (
    selected
  ) {

    return;

  }


  selected =
    true;


  const cards =
    document.querySelectorAll(
      ".card"
    );


  let fortune;


  /*
     スペースキーを押しながら
     カードを引いた場合
  */

  if (
    spacePressed
  ) {

    if (
      currentMode ===
      "love"
    ) {

      fortune = [
        "💖 大恋愛",
        "運命の恋が動き出す予感！"
      ];

    }

    else if (
      currentMode ===
      "dark"
    ) {

      fortune = [
        "☠ 真・闇",
        "あなたは禁断の領域に足を踏み入れた。"
      ];

    }

    else {

      fortune = [
        "大吉",
        "最高の運勢！今日は何をしてもうまくいきそう！"
      ];

    }

  }

  else {

    if (
      currentMode ===
      "normal"
    ) {

      fortune =
        getNormalFortune();

    }

    else {

      let list;


      if (
        currentMode ===
        "love"
      ) {

        list =
          loveFortunes;

      }

      else {

        list =
          darkFortunes;

      }


      const randomIndex =
        Math.floor(
          Math.random() *
          list.length
        );


      fortune =
        list[randomIndex];

    }

  }


  const selectedCard =
    event.currentTarget;


  selectedCard
    .classList.add(
      "selected"
    );


  cards.forEach(
    card => {

      if (
        card !==
        selectedCard
      ) {

        card.classList.add(
          "disabled"
        );

      }

    }
  );


  selectedCard
    .querySelector(
      ".card-result"
    )
    .textContent =
      fortune[0];


  selectedCard
    .querySelector(
      ".card-detail"
    )
    .textContent =
      fortune[1];


  setTimeout(
    () => {

      showBigResult(
        fortune
      );

    },
    700
  );

}


/* ========================================
   結果
======================================== */

function showBigResult(
  fortune
) {

  const resultScreen =
    document.getElementById(
      "resultScreen"
    );


  document.getElementById(
    "bigResult"
  ).textContent =
    fortune[0];


  document.getElementById(
    "bigMessage"
  ).textContent =
    fortune[1];


  resultScreen.classList.remove(
    "normal-result",
    "dark-result"
  );


  if (
    currentMode ===
    "normal"
  ) {

    resultScreen.classList.add(
      "normal-result"
    );


    document.getElementById(
      "resultIcon"
    ).textContent =
      "🎋";

  }

  else if (
    currentMode ===
    "love"
  ) {

    document.getElementById(
      "resultIcon"
    ).textContent =
      "💕";

  }

  else {

    resultScreen.classList.add(
      "dark-result"
    );


    document.getElementById(
      "resultIcon"
    ).textContent =
      "☠";

  }


  resultScreen.classList.add(
    "show"
  );


  createSparkles();

}


/* ========================================
   結果を閉じる
======================================== */

function closeResult() {

  document
    .getElementById(
      "resultScreen"
    )
    .classList.remove(
      "show"
    );


  setTimeout(
    () => {

      if (
        currentMode ===
        "dark"
      ) {

        lockDarkFortune();

      }


      resetCards();

    },
    300
  );

}


/* ========================================
   闇みくじ終了
======================================== */

function lockDarkFortune() {

  changeMode(
    "normal"
  );

}


/* ========================================
   リセット
======================================== */

function resetCards() {

  selected =
    false;


  shuffleCards();


  document
    .querySelectorAll(
      ".card"
    )
    .forEach(
      card => {

        card.classList.remove(
          "selected",
          "disabled"
        );


        card.querySelector(
          ".card-result"
        ).textContent =
          "";


        card.querySelector(
          ".card-detail"
        ).textContent =
          "";

      }
    );


  document.getElementById(
    "fortune"
  ).textContent =
    "？？？";


  document.getElementById(
    "message"
  ).textContent =

    currentMode ===
    "love"

      ? "カードを1枚選んでください 💕"

      : currentMode ===
        "dark"

      ? "闇に触れるカードを1枚選んでください ☠"

      : "カードを1枚選んでください ✨";

}


/* ========================================
   キラキラ
======================================== */

function createSparkles() {

  const screen =
    document.getElementById(
      "screen"
    );


  let symbols;


  if (
    currentMode ===
    "love"
  ) {

    symbols = [
      "💕",
      "💗",
      "✨",
      "💖",
      "💘"
    ];

  }

  else if (
    currentMode ===
    "dark"
  ) {

    symbols = [
      "☠",
      "🩸",
      "⚫",
      "🔻"
    ];

  }

  else {

    symbols = [
      "✨",
      "🌸",
      "🎋",
      "⭐"
    ];

  }


  for (
    let i = 0;
    i < 14;
    i++
  ) {

    const sparkle =
      document.createElement(
        "div"
      );


    sparkle.className =
      "sparkle";


    sparkle.textContent =
      symbols[
        Math.floor(
          Math.random() *
          symbols.length
        )
      ];


    sparkle.style.left =
      (
        10 +
        Math.random() * 80
      ) + "%";


    sparkle.style.top =
      (
        15 +
        Math.random() * 70
      ) + "%";


    sparkle.style.animationDelay =
      (
        Math.random() * .5
      ) + "s";


    screen.appendChild(
      sparkle
    );


    setTimeout(
      () =>
        sparkle.remove(),
      1600
    );

  }

}


/* ========================================
   闇ボタン → パスコード
======================================== */

function openLock() {

  if (
    isLocked()
  ) {

    showLockedMessage();

    return;

  }


  enteredPassword =
    "";


  updateDots();


  document
    .getElementById(
      "lockError"
    )
    .classList.remove(
      "show"
    );


  document
    .getElementById(
      "lockScreen"
    )
    .classList.add(
      "show"
    );

}


/* ========================================
   数字入力
======================================== */

function pressKey(
  number
) {

  if (
    enteredPassword.length >=
    creatorPassword.length
  ) {

    return;

  }


  enteredPassword +=
    number;


  updateDots();


  if (
    enteredPassword.length ===
    creatorPassword.length
  ) {

    setTimeout(
      checkPassword,
      180
    );

  }

}


/* ========================================
   削除
======================================== */

function deleteKey() {

  enteredPassword =
    enteredPassword.slice(
      0,
      -1
    );


  updateDots();

}


/* ========================================
   ドット
======================================== */

function updateDots() {

  const dots =
    document.querySelectorAll(
      ".pass-dot"
    );


  dots.forEach(
    (
      dot,
      index
    ) => {

      dot.classList.toggle(
        "filled",
        index <
        enteredPassword.length
      );

    }
  );

}


/* ========================================
   パスワード確認
======================================== */

function checkPassword() {

  if (
    enteredPassword ===
    creatorPassword
  ) {

    wrongCount =
      0;


    localStorage.setItem(
      "omikujiWrongCount",
      "0"
    );


    unlockDarkFortune();

  }

  else {

    wrongCount++;


    localStorage.setItem(
      "omikujiWrongCount",
      String(
        wrongCount
      )
    );


    const error =
      document.getElementById(
        "lockError"
      );


    error.classList.remove(
      "show"
    );


    void error.offsetWidth;


    error.classList.add(
      "show"
    );


    enteredPassword =
      "";


    updateDots();


    if (
      wrongCount >=
      MAX_MISTAKES
    ) {

      start24HourLock();

    }

  }

}


/* ========================================
   闇みくじ解放
======================================== */

function unlockDarkFortune() {

  document
    .getElementById(
      "lockScreen"
    )
    .classList.remove(
      "show"
    );


  changeMode(
    "dark"
  );

}


/* ========================================
   パスコード閉じる
======================================== */

function closeLock() {

  document
    .getElementById(
      "lockScreen"
    )
    .classList.remove(
      "show"
    );

}


/* ========================================
   24時間ロック
======================================== */

function start24HourLock() {

  lockUntil =
    Date.now() +
    LOCK_TIME;


  localStorage.setItem(
    "omikujiLockUntil",
    String(
      lockUntil
    )
  );


  enteredPassword =
    "";


  updateDots();


  document
    .getElementById(
      "lockScreen"
    )
    .classList.remove(
      "show"
    );


  setTimeout(
    () => {

      showLockedMessage();

    },
    250
  );

}


/* ========================================
   ロック確認
======================================== */

function isLocked() {

  const now =
    Date.now();


  if (
    lockUntil &&
    now < lockUntil
  ) {

    return true;

  }


  if (
    lockUntil &&
    now >= lockUntil
  ) {

    lockUntil =
      0;


    wrongCount =
      0;


    localStorage.removeItem(
      "omikujiLockUntil"
    );


    localStorage.setItem(
      "omikujiWrongCount",
      "0"
    );

  }


  return false;

}


/* ========================================
   ロック画面
======================================== */

function showLockedMessage() {

  updateRemainingTime();


  document
    .getElementById(
      "lockedMessage"
    )
    .classList.add(
      "show"
    );

}


/* ========================================
   残り時間
======================================== */

function updateRemainingTime() {

  if (
    !isLocked()
  ) {

    closeLockedMessage();

    return;

  }


  const remaining =
    lockUntil -
    Date.now();


  const hours =
    Math.floor(
      remaining /
      (1000 * 60 * 60)
    );


  const minutes =
    Math.floor(
      (
        remaining %
        (1000 * 60 * 60)
      ) /
      (1000 * 60)
    );


  const seconds =
    Math.floor(
      (
        remaining %
        (1000 * 60)
      ) /
      1000
    );


  document.getElementById(
    "remainingTime"
  ).textContent =

    "解除まで " +
    hours +
    "時間 " +
    minutes +
    "分 " +
    seconds +
    "秒";


  setTimeout(
    updateRemainingTime,
    1000
  );

}


/* ========================================
   ロック閉じる
======================================== */

function closeLockedMessage() {

  document
    .getElementById(
      "lockedMessage"
    )
    .classList.remove(
      "show"
    );

}


/* ========================================
   起動
======================================== */

window.addEventListener(
  "load",
  () => {

    resetCards();

  }
);

</script>
