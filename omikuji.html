

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎋 おみくじ</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #f7c5c5, #ffe5ac);
  font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
}

/* スマホ本体 */
.phone {
  position: relative;
  width: 340px;
  height: 680px;
  padding: 10px;
  background: #222;
  border: 7px solid #111;
  border-radius: 48px;
  box-shadow: 0 25px 50px rgba(0,0,0,.3);
}

/* ノッチ */
.notch {
  position: absolute;
  z-index: 20;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: 105px;
  height: 25px;
  border-radius: 20px;
  background: #111;
}

/* スマホ画面 */
.screen {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  border-radius: 35px;
  background:
    radial-gradient(circle at 15% 20%, #ffd2d2 0 5%, transparent 6%),
    radial-gradient(circle at 85% 30%, #ffe3ae 0 5%, transparent 6%),
    #fff8f5;
}

/* 桜 */
.sakura {
  position: absolute;
  font-size: 38px;
  opacity: .4;
}

.s1 { top: 70px; left: 10px; }
.s2 { top: 150px; right: 10px; }
.s3 { bottom: 100px; left: 10px; }
.s4 { bottom: 150px; right: 15px; }

/* コンテンツ */
.content {
  position: relative;
  z-index: 2;
  padding: 65px 22px 25px;
  text-align: center;
}

h1 {
  margin: 0;
  color: #b71c1c;
  font-size: 30px;
}

.subtitle {
  margin: 7px 0 15px;
  color: #777;
  font-size: 13px;
}

/* おみくじエリア */
.omikuji-area {
  position: relative;
  width: 190px;
  height: 205px;
  margin: 0 auto;
}

/* おみくじ箱 */
.omikuji-box {
  position: absolute;
  left: 5px;
  bottom: 0;
  width: 180px;
  height: 155px;
  border-radius: 15px 15px 25px 25px;
  background: linear-gradient(
    90deg,
    #9e1515,
    #d32f2f,
    #ef5350,
    #b71c1c
  );
  box-shadow:
    0 10px 20px rgba(120,0,0,.3),
    inset 5px 0 rgba(255,255,255,.12);
}

/* 箱の金色模様 */
.omikuji-box::before {
  content: "福";
  position: absolute;
  left: 50%;
  top: 58%;
  transform: translate(-50%, -50%);
  color: #ffd54f;
  font-size: 65px;
  font-weight: bold;
}

/* 箱の口 */
.box-top {
  position: absolute;
  z-index: 4;
  left: 20px;
  top: -5px;
  width: 140px;
  height: 18px;
  border-radius: 50%;
  background: #761010;
  border: 3px solid #5d0b0b;
}

/* 棒 */
.stick {
  position: absolute;
  z-index: 3;
  left: 50%;
  top: -95px;
  width: 13px;
  height: 130px;
  transform: translateX(-50%);
  transform-origin: bottom center;
  border-radius: 8px 8px 2px 2px;
  background: linear-gradient(
    90deg,
    #a96f32,
    #f5c26b,
    #c58b45
  );
  box-shadow: 2px 2px 5px rgba(0,0,0,.25);
}

/* シャカシャカ */
.shaking .stick {
  animation: shake .11s infinite alternate;
}

.shaking .omikuji-box {
  animation: boxShake .11s infinite alternate;
}

@keyframes shake {
  from {
    transform: translateX(-50%) rotate(-18deg);
  }
  to {
    transform: translateX(-50%) rotate(18deg);
  }
}

@keyframes boxShake {
  from {
    transform: translateX(-5px) rotate(-2deg);
  }
  to {
    transform: translateX(5px) rotate(2deg);
  }
}

/* 紙のおみくじ */
.paper {
  position: absolute;
  z-index: 2;
  left: 50%;
  bottom: 65px;

  width: 115px;
  height: 145px;

  padding: 12px 8px;

  transform:
    translateX(-50%)
    translateY(100px);

  background:
    linear-gradient(
      90deg,
      #fffdf2,
      #fff8dc,
      #fffdf2
    );

  border: 2px solid #d8b96a;

  box-shadow:
    0 5px 12px rgba(0,0,0,.2);

  opacity: 0;
}

/* 紙の模様 */
.paper::before {
  content: "御神籤";
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  color: #a67c00;
  font-size: 12px;
  writing-mode: vertical-rl;
}

/* 結果 */
#paperResult {
  position: absolute;
  top: 48px;
  left: 0;
  width: 100%;

  color: #b71c1c;
  font-size: 30px;
  font-weight: bold;
  text-align: center;

  writing-mode: vertical-rl;
}

/* 紙が飛び出す */
.paper.show {
  animation: paperOut 1.2s cubic-bezier(.2,.9,.25,1.2) forwards;
}

@keyframes paperOut {

  0% {
    transform:
      translateX(-50%)
      translateY(100px)
      rotate(0deg);

    opacity: 0;
  }

  30% {
    opacity: 1;
  }

  70% {
    transform:
      translateX(-50%)
      translateY(-45px)
      rotate(-4deg);
  }

  100% {
    transform:
      translateX(-50%)
      translateY(-30px)
      rotate(0deg);

    opacity: 1;
  }
}

/* 結果メッセージ */
.result {
  min-height: 85px;
  padding: 10px;
  border: 2px solid #d32f2f;
  border-radius: 15px;
  background: rgba(255,255,255,.92);
}

#fortune {
  color: #c62828;
  font-size: 35px;
  font-weight: bold;
}

#message {
  margin-top: 4px;
  color: #555;
  font-size: 12px;
  line-height: 1.5;
}

/* ボタン */
button {
  width: 100%;
  margin-top: 15px;
  padding: 15px;

  border: 0;
  border-radius: 50px;

  background: linear-gradient(
    135deg,
    #d32f2f,
    #a91515
  );

  color: white;
  font-size: 17px;
  font-weight: bold;

  cursor: pointer;

  box-shadow:
    0 5px 12px rgba(160,0,0,.3);
}

button:active {
  transform: scale(.96);
}

button:disabled {
  opacity: .6;
}

/* 結果が出たとき */
.result.pop {
  animation: pop .5s ease-out;
}

@keyframes pop {
  0% {
    transform: scale(.7);
    opacity: 0;
  }

  70% {
    transform: scale(1.08);
  }

  100% {
    transform: scale(1);
    opacity: 1;
  }
}

/* ホームバー */
.home-bar {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 100px;
  height: 4px;
  border-radius: 10px;
  background: #333;
}

/* キラキラ */
.sparkle {
  position: absolute;
  z-index: 10;
  pointer-events: none;
  font-size: 25px;
  opacity: 0;
}

.sparkle.show {
  animation: sparkle 1s ease-out forwards;
}

@keyframes sparkle {
  0% {
    transform: scale(.3);
    opacity: 0;
  }

  30% {
    opacity: 1;
  }

  100% {
    transform: scale(1.5) translateY(-30px);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="phone">

  <div class="notch"></div>

  <div class="screen">

    <div class="sakura s1">🌸</div>
    <div class="sakura s2">🌸</div>
    <div class="sakura s3">🌸</div>
    <div class="sakura s4">🌸</div>

    <div class="content">

      <h1>🎋 おみくじ 🎋</h1>

      <div class="subtitle">
        今日の運勢を占おう
      </div>

      <!-- おみくじ -->
      <div class="omikuji-area" id="area">

        <!-- 飛び出す紙 -->
        <div class="paper" id="paper">
          <div id="paperResult">？？？</div>
        </div>

        <!-- 箱 -->
        <div class="omikuji-box" id="box">

          <div class="box-top"></div>

          <div class="stick"></div>

        </div>

      </div>

      <!-- 結果 -->
      <div class="result" id="resultBox">

        <div id="fortune">？？？</div>

        <div id="message">
          おみくじを引いてみよう！
        </div>

      </div>

      <button id="drawButton" onclick="drawOmikuji()">
        🎋 おみくじを引く！
      </button>

    </div>

    <div class="home-bar"></div>

  </div>
</div>


<script>

const fortunes = [
  {
    name: "大吉",
    message: "最高の運勢！✨<br>今日は何をしてもうまくいきそう！"
  },
  {
    name: "中吉",
    message: "いいことが起こりそう！🌸<br>笑顔を大切にしよう。"
  },
  {
    name: "小吉",
    message: "小さな幸せが見つかる日。<br>周りをよく見てみよう。"
  },
  {
    name: "吉",
    message: "落ち着いて行動すれば<br>良い結果につながりそう！"
  },
  {
    name: "末吉",
    message: "これから運気上昇！📈<br>焦らずゆっくり進もう。"
  },
  {
    name: "凶",
    message: "今日は慎重に行動しよう。<br>きっと明日は良い日になる！"
  }
];


function drawOmikuji() {

  const button = document.getElementById("drawButton");
  const box = document.getElementById("box");
  const paper = document.getElementById("paper");
  const resultBox = document.getElementById("resultBox");

  /* ボタン無効 */
  button.disabled = true;
  button.textContent = "🎋 シャカシャカ…";

  /* 紙を一旦戻す */
  paper.classList.remove("show");

  /* 結果をリセット */
  document.getElementById("fortune").textContent = "？？？";
  document.getElementById("message").textContent =
    "運勢を占っています…";

  /* シャカシャカ開始 */
  box.classList.add("shaking");

  /* 2秒後 */
  setTimeout(() => {

    /* シャカシャカ停止 */
    box.classList.remove("shaking");

    /* 結果を決める */
    const random =
      Math.floor(Math.random() * fortunes.length);

    const fortune = fortunes[random];

    /* 紙に結果 */
    document.getElementById("paperResult").textContent =
      fortune.name;

    /* 紙を飛び出させる */
    paper.classList.add("show");

    /* 少し遅れて結果表示 */
    setTimeout(() => {

      document.getElementById("fortune").textContent =
        fortune.name;

      document.getElementById("message").innerHTML =
        fortune.message;

      resultBox.classList.remove("pop");

      void resultBox.offsetWidth;

      resultBox.classList.add("pop");

      button.disabled = false;
      button.textContent = "🔄 もう一度引く！";

    }, 700);

  }, 2000);
}

</script>

</body>
</html>
