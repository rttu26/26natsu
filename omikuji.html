<!DOCTYPE html>
<html lang="ja">
<head>

<style>
* {

}

body {
  margin: 0;

  justify-content: center;

  background:

/* =========================
   スマホ
========================= */

.phone {
  position: relative;
  width: 350px;
  height: 700px;
  padding: 10px;
  background: #222;
  border: 7px solid #111;
  border-radius: 50px;
  box-shadow: 0 25px 55px rgba(0,0,0,.3);
}

.notch {
  position: absolute;
  z-index: 20;
  top: 10px;

  transform: translateX(-50%);

  border-radius: 20px;
  background: #111;
}

.screen {
  position: relative;

}

/* 桜 */

.sakura {
  position: absolute;
  font-size: 35px;
  opacity: .35;
}

.s1 {
  top: 65px;

.s2 {
  top: 135px;

}

.s3 {
  bottom: 90px;
  left: 12px;

  right: 12px;

/* =========================
   メイン
========================= */

.content {
  position: relative;
  z-index: 2;
  padding: 55px 17px 25px;
  text-align: center;
}

h1 {
  margin: 0;
  color: #b71c1c;
  font-size: 28px;
}

.subtitle {
  margin: 5px 0 12px;
  color: #777;
  font-size: 12px;
}

/* =========================
   モード切り替え
========================= */

.mode-buttons {
  display: flex;
  gap: 7px;
  margin-bottom: 13px;
}

.mode-buttons button {
  flex: 1;
  padding: 8px 4px;
  border: 0;
  border-radius: 30px;
  background: #eee;
  color: #777;
  font-size: 12px;
  cursor: pointer;
}

.mode-buttons button.active {

  color: white;
}

.mode-buttons button.love.active {
  background: #e91e63;
}

/* =========================
   9枚のカード
========================= */

.cards {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
  perspective: 1000px;
}

/* カード */

.card {
  height: 125px;
  position: relative;
  cursor: pointer;
  perspective: 800px;
}

.card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform .75s cubic-bezier(.2,.7,.2,1);
  transform-style: preserve-3d;
}

.card.selected .card-inner {
  transform: rotateY(180deg);
}

/* カード表裏 */

.card-front,
.card-back {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  border-radius: 12px;
  overflow: hidden;
}

/* =========================
   カードの裏側
========================= */

.card-back {
  display: flex;
  justify-content: center;
  align-items: center;

  background:
    repeating-linear-gradient(
      45deg,
      transparent,
      transparent 5px,
      rgba(255,255,255,.12) 6px,
      transparent 7px
    ),
    #b71c1c;

  border: 3px solid #f4c76b;

  box-shadow:

  color: #ffd76a;
}

/* 恋みくじ */

.love-mode .card-back {
  background:
    repeating-linear-gradient(
      45deg,
      transparent,
      transparent 5px,
      rgba(255,255,255,.12) 6px,
      transparent 7px
    ),
    #c2185b;

  border-color: #ffd1df;
}

.card-back::before {
  content: "🎋";
  font-size: 34px;
}

.love-mode .card-back::before {
  content: "💗";
}

/* =========================
   カード表
========================= */

.card-front {
  transform: rotateY(180deg);

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  padding: 5px;

  background:
    linear-gradient(
      135deg,
      #fffdf2,
      #fff5d8
    );

  border: 3px solid #d4aa48;

  box-shadow:
    0 5px 15px rgba(0,0,0,.2);
}

.love-mode .card-front {
  background:
    linear-gradient(
      135deg,
      #fff8fb,
      #ffe3ed
    );

  border-color: #e57399;
}

.card-front::before {
  content: "御神籤";
  color: #9b751b;
  font-size: 9px;
  margin-bottom: 5px;
}

.love-mode .card-front::before {
  content: "恋みくじ";
  color: #c2185b;
}

.card-result {
  color: #b71c1c;
  font-size: 18px;
  font-weight: bold;
  text-align: center;
}

.love-mode .card-result {
  color: #e91e63;
}

.card-detail {
  margin-top: 5px;
  color: #666;
  font-size: 8px;
  line-height: 1.3;
}

/* =========================
   選ぶ前の演出
========================= */

.cards:not(.finished) .card:hover {
  transform: translateY(-6px);
}

.card.disabled {
  pointer-events: none;
  opacity: .35;
}

.card.selected {
  transform: translateY(-8px);
}

/* 選んだカードを目立たせる */

.card.selected .card-front {
  box-shadow:
    0 0 0 3px #ffd54f,
    0 8px 20px rgba(255,80,80,.35);
}

/* =========================
   結果
========================= */

.result-box {
  min-height: 72px;
  margin-top: 13px;
  padding: 8px;

  border: 2px solid #c62828;
  border-radius: 15px;

  background: rgba(255,255,255,.94);
}

.love-mode .result-box {
  border-color: #e91e63;
}

#fortune {
  color: #c62828;
  font-size: 27px;
  font-weight: bold;
}

.love-mode #fortune {
  color: #e91e63;
}

#message {
  margin-top: 3px;
  color: #555;
  font-size: 10px;
  line-height: 1.4;
}

/* =========================
   ボタン
========================= */

#resetButton {
  width: 100%;
  margin-top: 10px;
  padding: 12px;

  border: 0;
  border-radius: 50px;

  background:
    linear-gradient(
      135deg,
      #d32f2f,
      #a91515
    );

  color: white;
  font-size: 15px;
  font-weight: bold;

  cursor: pointer;

  box-shadow:
    0 5px 12px rgba(160,0,0,.3);
}

.love-mode #resetButton {
  background:
    linear-gradient(
      135deg,
      #ec407a,
      #c2185b
    );
}

#resetButton:active {
  transform: scale(.96);
}

/* ホームバー */

.home-bar {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);

  width: 100px;
  height: 4px;

  border-radius: 10px;
  background: #333;
}

/* =========================
   キラキラ
========================= */

.sparkle {
  position: absolute;
  z-index: 30;
  pointer-events: none;
  font-size: 24px;
  animation: sparkle 1s ease-out forwards;
}

@keyframes sparkle {

  0% {
    transform: scale(.2);
    opacity: 0;
  }

  30% {
    opacity: 1;
  }

  100% {
    transform:
      translateY(-45px)
      scale(1.4);
    opacity: 0;
  }
}

</style>
</head>


<body>

<script>

/* =========================
   データ
========================= */

const normalFortunes = [

  ["大吉", "最高の運勢！何事にも積極的に。"],

  ["中吉", "いいことが起こりそう。笑顔を大切に。"],

  ["小吉", "小さな幸せを見つけられる日。"],

  ["吉", "落ち着いて行動すれば良い結果に。"],

  ["末吉", "これから運気が上がっていく予感。"],

  ["吉", "周りの人を大切にすると運気アップ。"],

  ["小吉", "焦らず自分のペースで進もう。"],

  ["中吉", "新しいことを始めるのに良い日。"],

  ["大吉", "今日は何をしても絶好調！✨"]

];


const loveFortunes = [

  ["💖 大恋愛", "運命の恋が動き出す予感！"],

  ["💕 両思い", "二人の心はかなり近いかも。"],

  ["💘 恋愛成就", "あなたの恋が実るチャンス！"],

  ["🌸 片思い吉", "少しずつ距離を縮めてみよう。"],

  ["💌 連絡吉", "今日は連絡運が絶好調！"],

  ["💗 恋の予感", "思いがけない出会いがありそう。"],

  ["💞 相性◎", "二人の相性はとても良さそう。"],

  ["💓 告白吉", "勇気を出すと恋が動くかも。"],

  ["💔 恋愛注意", "焦らず相手の気持ちを考えてみよう。"]

];


let currentMode = "normal";
let selected = false;


/* =========================
   モード変更
========================= */

function changeMode(mode) {

  currentMode = mode;

  const screen =
    document.getElementById("screen");

  const normalButton =
    document.getElementById("normalButton");

  const loveButton =
    document.getElementById("loveButton");

  screen.classList.remove("love-mode");

  normalButton.classList.remove("active");
  loveButton.classList.remove("active");


  if (mode === "love") {

    screen.classList.add("love-mode");
    loveButton.classList.add("active");

    document.getElementById("title").textContent =
      "💕 恋みくじ 💕";

    document.getElementById("subtitle").textContent =
      "9枚の中から1枚選んでね";

  } else {

    normalButton.classList.add("active");

    document.getElementById("title").textContent =
      "🎋 おみくじ 🎋";

    document.getElementById("subtitle").textContent =
      "9枚の中から1枚選んでね";
  }


  resetCards();
}


/* =========================
   カードを選ぶ
========================= */

function selectCard(index) {

  if (selected) return;

  selected = true;

  const cards =
    document.querySelectorAll(".card");

  const list =
    currentMode === "love"
      ? loveFortunes
      : normalFortunes;


  /* 選んだ結果 */

  const fortune =
    list[index];


  /* 選んだカードだけ表にする */

  cards[index].classList.add("selected");


  /* 他のカードを薄くする */

  cards.forEach((card, i) => {

    if (i !== index) {
      card.classList.add("disabled");
    }

  });


  /* カードに結果を書く */

  cards[index]
    .querySelector(".card-result")
    .textContent = fortune[0];

  cards[index]
    .querySelector(".card-detail")
    .textContent = fortune[1];


  /* 下にも結果表示 */

  setTimeout(() => {

    document.getElementById("fortune")
      .textContent = fortune[0];

    document.getElementById("message")
      .textContent = fortune[1];

    createSparkles();

  }, 500);
}


/* =========================
   リセット
========================= */

function resetCards() {

  selected = false;

  const cards =
    document.querySelectorAll(".card");

  cards.forEach(card => {

    card.classList.remove(
      "selected",
      "disabled"
    );

    card.querySelector(".card-result")
      .textContent = "";

    card.querySelector(".card-detail")
      .textContent = "";

  });


  document.getElementById("fortune")
    .textContent = "？？？";

  document.getElementById("message")
    .textContent =
      currentMode === "love"
        ? "カードを1枚選んでください 💕"
        : "カードを1枚選んでください ✨";
}


/* =========================
   キラキラ演出
========================= */

function createSparkles() {

  const screen =
    document.getElementById("screen");

  const symbols =
    currentMode === "love"
      ? ["💕", "💗", "✨", "💖"]
      : ["✨", "🌸", "🎋", "⭐"];


  for (let i = 0; i < 10; i++) {

    const sparkle =
      document.createElement("div");

    sparkle.className = "sparkle";

    sparkle.textContent =
      symbols[
        Math.floor(
          Math.random() * symbols.length
        )
      ];

    sparkle.style.left =
      (30 + Math.random() * 40) + "%";

    sparkle.style.top =
      (35 + Math.random() * 30) + "%";

    sparkle.style.animationDelay =
      (Math.random() * .4) + "s";

    screen.appendChild(sparkle);


    setTimeout(() => {
      sparkle.remove();
    }, 1500);
  }
}

</script>
