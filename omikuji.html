<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>おみくじ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: linear-gradient(135deg, #fff0f0, #ffe4b5);
    }

    .omikuji {
      width: min(90%, 420px);
      padding: 40px 30px;
      text-align: center;
      background: white;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }

    h1 {
      margin-top: 0;
      color: #c62828;
      font-size: 36px;
    }

    .box {
      min-height: 180px;
      margin: 25px 0;
      padding: 25px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 3px solid #c62828;
      border-radius: 16px;
      background: #fffafa;
    }

    #result {
      font-size: 48px;
      font-weight: bold;
      color: #c62828;
    }

    #message {
      margin-top: 15px;
      font-size: 16px;
      color: #555;
    }

    button {
      padding: 15px 40px;
      border: none;
      border-radius: 50px;
      background: #c62828;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #a91f1f;
      transform: scale(1.05);
    }

    button:active {
      transform: scale(0.95);
    }
  </style>
</head>

<body>

  <div class="omikuji">
    <h1>🎋 おみくじ 🎋</h1>

    <div class="box">
      <div id="result">？？？</div>
      <div id="message">ボタンを押して運勢を占おう！</div>
    </div>

    <button onclick="drawOmikuji()">おみくじを引く！</button>
  </div>

  <script>
    const fortunes = [
      {
        name: "大吉",
        message: "最高の運勢！何事にも積極的に挑戦しよう！"
      },
      {
        name: "中吉",
        message: "いいことが起こりそう。笑顔を大切に！"
      },
      {
        name: "小吉",
        message: "小さな幸せを見つけられる一日になりそう。"
      },
      {
        name: "吉",
        message: "落ち着いて行動すれば、きっと良い結果に！"
      },
      {
        name: "末吉",
        message: "これから運気が上がっていく予感！"
      },
      {
        name: "凶",
        message: "焦らず慎重に。明日はきっと良くなる！"
      }
    ];

    function drawOmikuji() {
      const randomIndex = Math.floor(Math.random() * fortunes.length);
      const fortune = fortunes[randomIndex];

      document.getElementById("result").textContent = fortune.name;
      document.getElementById("message").textContent = fortune.message;
    }
  </script>

</body>
</html>
