<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>推しガチャ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Arial", "Hiragino Kaku Gothic ProN", sans-serif;
    }

    /* スマホ画面 */
    .phone {
      width: 390px;
      height: 844px;
      max-width: 100vw;
      max-height: 100vh;
      background: linear-gradient(180deg, #fff4fb, #f0eaff);
      border-radius: 35px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 40px rgba(0,0,0,.5);
      border: 8px solid #111;
    }

    /* 上部 */
    .header {
      padding: 22px 20px 12px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      color: #ff4f9a;
      font-size: 27px;
    }

    .header p {
      margin: 6px 0;
      color: #777;
      font-size: 13px;
    }

    /* ガチャ本体 */
    .gacha {
      width: 280px;
      height: 330px;
      margin: 30px auto 10px;
      position: relative;
    }

    .machine {
      width: 240px;
      height: 210px;
      background: linear-gradient(135deg, #ff72ae, #9c72ff);
      border-radius: 35px 35px 20px 20px;
      position: absolute;
      left: 20px;
      top: 60px;
      box-shadow: inset 0 -10px 0 rgba(0,0,0,.12);
    }

    .globe {
      width: 155px;
      height: 155px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff, #ffd9ec 35%, #ff91bd);
      position: absolute;
      left: 42px;
      top: -65px;
      border: 8px solid #fff;
      box-shadow: 0 5px 15px rgba(0,0,0,.2);
      overflow: hidden;
    }

    .ball {
      position: absolute;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #ffe45e;
      box-shadow: inset -5px -5px 0 rgba(0,0,0,.1);
    }

    .ball:nth-child(1) {
      left: 25px;
      top: 30px;
    }

    .ball:nth-child(2) {
      left: 85px;
      top: 45px;
      background: #74d9ff;
    }

    .ball:nth-child(3) {
      left: 50px;
      top: 90px;
      background: #b78cff;
    }

    .slot {
      position: absolute;
      width: 70px;
      height: 38px;
      background: #333;
      border-radius: 20px;
      left: 85px;
      bottom: 35px;
    }

    .knob {
      position: absolute;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: #ffe45e;
      border: 7px solid #fff;
      right: -25px;
      bottom: 35px;
      cursor: pointer;
      transition: transform .15s;
    }

    .knob:active {
      transform: rotate(45deg) scale(.9);
    }

    /* 結果 */
    .result {
      width: 300px;
      min-height: 150px;
      margin: 5px auto 15px;
      background: rgba(255,255,255,.85);
      border-radius: 25px;
      padding: 18px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(100,50,150,.12);
    }

    .result .icon {
      width: 65px;
      height: 65px;
      margin: 0 auto 8px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      background: linear-gradient(135deg,#ff9dcc,#9d8aff);
    }

    .result .name {
      font-size: 21px;
      font-weight: bold;
      color: #333;
    }

    .result .group {
      font-size: 13px;
      color: #888;
      margin-top: 3px;
    }

    /* ガチャボタン */
    button {
      display: block;
      margin: 0 auto;
      width: 250px;
      padding: 15px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(90deg,#ff4f9a,#9b70ff);
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 7px 15px rgba(150,70,180,.25);
    }

    button:active {
      transform: scale(.96);
    }

    .message {
      text-align: center;
      color: #999;
      font-size: 11px;
      margin-top: 12px;
    }

    /* ガチャ演出 */
    .shake {
      animation: shake .5s ease;
    }

    @keyframes shake {
      0%   { transform: translateX(0) rotate(0); }
      20%  { transform: translateX(-12px) rotate(-4deg); }
      40%  { transform: translateX(12px) rotate(4deg); }
      60%  { transform: translateX(-8px) rotate(-3deg); }
      80%  { transform: translateX(8px) rotate(3deg); }
      100% { transform: translateX(0) rotate(0); }
    }
  </style>
</head>

<body>

  <div class="phone">

    <div class="header">
      <h1>✨ 推しガチャ ✨</h1>
      <p>STPR × ミリプロ RANDOM GACHA</p>
    </div>

    <div class="gacha" id="gacha">
      <div class="globe">
        <div class="ball"></div>
        <div class="ball"></div>
        <div class="ball"></div>
      </div>

      <div class="machine">
        <div class="slot"></div>
        <div class="knob"></div>
      </div>
    </div>

    <div class="result">
      <div class="icon" id="icon">❓</div>
      <div class="name" id="name">？？？</div>
      <div class="group" id="group">
        ボタンを押してガチャ！
      </div>
    </div>

    <button onclick="gacha()">🎰 ガチャを回す！</button>

    <div class="message">
      ※このページはファン向けの非公式デモです
    </div>

  </div>

  <script>
    // メンバー一覧
    const members = [
      // STPR
      { name: "莉犬", group: "STPR", icon: "🐶" },
      { name: "るぅと", group: "STPR", icon: "🐹" },
      { name: "ころん", group: "STPR", icon: "🐐" },
      { name: "さとみ", group: "STPR", icon: "🐱" },
      { name: "ななもり。", group: "STPR", icon: "💜" },
      { name: "ジェル", group: "STPR", icon: "🧡" },

      // ミリプロ
      { name: "甘狼このみ", group: "ミリプロ", icon: "🐺" },
      { name: "音ノ乃のの", group: "ミリプロ", icon: "🎵" },
      { name: "ゆらぎゆら", group: "ミリプロ", icon: "🫧" },
      { name: "あくび・でもんすぺーど", group: "ミリプロ", icon: "😈" }
    ];

    function gacha() {
      const machine = document.getElementById("gacha");

      // 演出
      machine.classList.remove("shake");
      void machine.offsetWidth;
      machine.classList.add("shake");

      // 少し待ってから結果表示
      setTimeout(() => {

        const randomIndex =
          Math.floor(Math.random() * members.length);

        const member = members[randomIndex];

        document.getElementById("icon").textContent = member.icon;
        document.getElementById("name").textContent = member.name;
        document.getElementById("group").textContent =
          "所属：" + member.group;

      }, 500);
    }
  </script>

</body>
</html>
